<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipoca & Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1218;
    --bg-elev:#171B24;
    --bg-elev-2:#1E2330;
    --marquee:#F2A93B;
    --marquee-dim:#8A6A2E;
    --velvet:#8A2A4C;
    --cream:#EFE6D8;
    --cream-dim:#C9BFAF;
    --teal:#3C8C7A;
    --ink:#181310;
    --danger:#C4553D;
    --gold:#C9992E;
    --radius:10px;
    --max:460px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ambient popcorn background ---------- */
  #popcorn-bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    background:var(--bg);
    /* Toda palavra deste app vive dentro da coluna central (--max).
       Por isso a pipoca perto/atrás do texto cai para ~10% de opacidade,
       preservando contraste e leitura em qualquer ponto de rolagem. */
    mask-image: linear-gradient(90deg,
      black 0,
      black calc(50% - 270px),
      rgba(0,0,0,0.1) calc(50% - 230px),
      rgba(0,0,0,0.1) calc(50% + 230px),
      black calc(50% + 270px),
      black 100%
    );
    -webkit-mask-image: linear-gradient(90deg,
      black 0,
      black calc(50% - 270px),
      rgba(0,0,0,0.1) calc(50% - 230px),
      rgba(0,0,0,0.1) calc(50% + 230px),
      black calc(50% + 270px),
      black 100%
    );
    mask-repeat:no-repeat;
    -webkit-mask-repeat:no-repeat;
  }
  #popcorn-bg::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(242,169,59,0.10), transparent 55%),
      linear-gradient(180deg, rgba(15,18,24,0.30) 0%, rgba(15,18,24,0.66) 55%, rgba(15,18,24,0.90) 100%);
    pointer-events:none;
  }

  /* ---------- realistic popcorn kernel (butterfly-type, multi-lobe) ---------- */
  .kernel{
    position:absolute;
    transform:translateY(-46px) rotate(var(--rot,0deg)) scale(0.6);
    opacity:0;
    animation:fallIn .6s cubic-bezier(.22,.9,.4,1.15) both;
  }
  .kernel.tier-large{ z-index:3; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.28)); }
  .kernel.tier-medium{ z-index:2; opacity:0.95; }
  .kernel.tier-small{ z-index:1; filter:blur(0.4px); opacity:0.8; }

  .kernel .petal{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 32% 26%, #FDFDFD 0%, #F4EFEA 55%, #C5BBB1 100%);
    box-shadow:
      inset -3px -3px 4px rgba(140,70,17,0.20),
      inset 2px 2px 3px rgba(255,255,255,0.65),
      0 1px 2px rgba(0,0,0,0.22);
  }
  .kernel .p1{ border-radius:58% 42% 63% 37% / 47% 58% 42% 53%; }
  .kernel .p2{ border-radius:40% 60% 45% 55% / 60% 40% 62% 38%; transform:rotate(35deg) scale(0.82); }
  .kernel .p3{ border-radius:65% 35% 40% 60% / 40% 55% 45% 60%; transform:rotate(-28deg) scale(0.7); }
  .kernel .core{
    position:absolute;
    width:38%; height:34%;
    left:30%; top:40%;
    border-radius:50% 50% 55% 45% / 55% 45% 55% 45%;
    background:radial-gradient(circle at 35% 28%, #F2AA4C 0%, #D9822B 55%, #8C4611 100%);
    box-shadow:0 0 4px rgba(242,170,76,0.55), inset -1px -1px 2px rgba(140,70,17,0.55);
  }

  @keyframes fallIn{
    0%{ transform:translateY(-46px) rotate(var(--rot,0deg)) scale(0.6); opacity:0; }
    62%{ transform:translateY(8px) rotate(var(--rot,0deg)) scale(1.06); opacity:1; }
    100%{ transform:translateY(0) rotate(var(--rot,0deg)) scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .kernel{animation:none;opacity:1;transform:translateY(0) rotate(var(--rot,0deg)) scale(1);}
  }

  #app{
    position:relative;
    z-index:1;
    max-width:var(--max);
    margin:0 auto;
    padding:20px 16px 48px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Marquee header ---------- */
  .marquee{
    text-align:center;
    padding:18px 10px 22px;
    position:relative;
  }
  .marquee-bulbs{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:10px;
  }
  .bulb{
    width:6px;height:6px;border-radius:50%;
    background:var(--marquee);
    box-shadow:0 0 6px 1px rgba(242,169,59,0.7);
    animation:flicker 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .bulb{animation:none;opacity:0.9;} }
  .bulb:nth-child(odd){animation-delay:0.4s;}
  .bulb:nth-child(3n){animation-delay:0.9s;}
  @keyframes flicker{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }
  .marquee h1{
    font-family:'Bebas Neue',cursive;
    font-size:44px;
    letter-spacing:3px;
    margin:0;
    color:var(--marquee);
    line-height:0.95;
    text-shadow:0 0 18px rgba(242,169,59,0.25);
  }
  .marquee p{
    margin:6px 0 0;
    font-size:12.5px;
    color:var(--cream-dim);
    letter-spacing:0.5px;
    font-family:'IBM Plex Mono',monospace;
  }

  .header-shield{
    position:relative;
    margin:-20px -16px 0;
    padding:20px 16px 4px;
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    background:linear-gradient(180deg, rgba(15,18,24,0.62) 0%, rgba(15,18,24,0.30) 75%, rgba(15,18,24,0) 100%);
  }

  /* ---------- top nav ---------- */
  .topnav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--cream-dim);
  }
  .topnav button{
    background:none;border:1px solid rgba(239,230,216,0.18);
    color:var(--cream-dim);
    padding:6px 10px;
    border-radius:20px;
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .topnav button:hover{border-color:var(--marquee);color:var(--marquee);}

  /* ---------- progress dots (film perforation) ---------- */
  .perf{
    display:flex;
    gap:6px;
    justify-content:center;
    margin:22px 0 26px;
  }
  .perf span{
    width:9px;height:9px;border-radius:2px;
    background:var(--bg-elev-2);
    border:1px solid rgba(239,230,216,0.15);
  }
  .perf span.done{background:var(--marquee);border-color:var(--marquee);}
  .perf span.now{background:var(--velvet);border-color:var(--velvet);}

  /* ---------- step card ---------- */
  .step-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--marquee);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .step-question{
    font-family:'Bebas Neue',cursive;
    font-size:30px;
    letter-spacing:0.5px;
    line-height:1.05;
    margin:0 0 18px;
    color:var(--cream);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .opt{
    text-align:left;
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.10);
    color:var(--cream);
    padding:13px 16px;
    border-radius:var(--radius);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:hover{border-color:var(--marquee);background:var(--bg-elev-2);}
  .opt:active{transform:scale(0.99);}
  .opt.selected{
    border-color:var(--marquee);
    background:linear-gradient(90deg, rgba(242,169,59,0.14), rgba(242,169,59,0.04));
  }

  .back-link{
    margin-top:18px;
    background:none;border:none;
    color:var(--cream-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
    padding:6px 0;
  }
  .back-link:hover{color:var(--marquee);}

  /* ---------- summary ---------- */
  .summary-list{
    display:flex;flex-wrap:wrap;gap:8px;
    margin:4px 0 22px;
  }
  .tag{
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.14);
    padding:7px 12px;
    border-radius:20px;
    font-size:12.5px;
    color:var(--cream-dim);
  }
  .tag b{color:var(--cream);font-weight:600;}

  .cta{
    width:100%;
    background:var(--marquee);
    color:var(--ink);
    border:none;
    padding:15px 18px;
    border-radius:var(--radius);
    font-family:'Bebas Neue',cursive;
    font-size:19px;
    letter-spacing:1px;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .cta:hover{filter:brightness(1.08);}
  .cta:active{transform:scale(0.985);}
  .cta.secondary{
    background:none;
    border:1px solid rgba(239,230,216,0.25);
    color:var(--cream);
  }
  .cta.small{padding:11px 14px;font-size:15px;}

  /* ---------- loading ---------- */
  .loading{
    text-align:center;
    padding:60px 10px;
  }
  .reel{
    width:46px;height:46px;margin:0 auto 18px;
    border-radius:50%;
    border:3px solid rgba(242,169,59,0.2);
    border-top-color:var(--marquee);
    animation:spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .reel{animation:spin 2.4s linear infinite;} }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{
    font-family:'IBM Plex Mono',monospace;
    color:var(--cream-dim);
    font-size:13px;
  }

  /* ---------- error ---------- */
  .error-box{
    background:rgba(196,85,61,0.12);
    border:1px solid rgba(196,85,61,0.4);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    font-size:13.5px;
    color:var(--cream);
  }

  /* ---------- results ---------- */
  .results-header{
    font-family:'Bebas Neue',cursive;
    font-size:26px;
    letter-spacing:0.5px;
    margin:0 0 4px;
  }
  .results-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--cream-dim);
    margin:0 0 20px;
  }

  /* ---------- hero pick ---------- */
  .hero-pick{
    border:1px solid rgba(242,169,59,0.35);
    background:linear-gradient(135deg, rgba(242,169,59,0.10), rgba(138,42,76,0.08));
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:26px;
  }
  .hero-pick .hp-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--marquee);
    margin-bottom:6px;
  }
  .hero-pick .hp-title{
    font-family:'Bebas Neue',cursive;
    font-size:24px;
    letter-spacing:0.3px;
    margin:0 0 6px;
  }
  .hero-pick .hp-reason{
    font-size:13px;
    color:var(--cream-dim);
    line-height:1.5;
    margin:0;
  }

  /* ---------- horizontal ticket carousel ---------- */
  .scroll-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    color:var(--cream-dim);
    text-align:center;
    margin:0 0 12px;
    opacity:0.75;
  }
  .tickets-scroll{
    display:flex;
    gap:16px;
    overflow-x:auto;
    overflow-y:visible;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    margin:0 -16px 8px;
    padding:4px 16px 20px;
    scrollbar-width:thin;
    scrollbar-color:var(--marquee-dim) transparent;
  }
  .tickets-scroll::-webkit-scrollbar{height:6px;}
  .tickets-scroll::-webkit-scrollbar-track{background:transparent;}
  .tickets-scroll::-webkit-scrollbar-thumb{background:var(--marquee-dim);border-radius:3px;}
  .tickets-scroll .ticket{
    flex:0 0 82vw;
    max-width:300px;
    scroll-snap-align:start;
    margin-bottom:0;
  }

  .ticket{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:var(--radius);
    overflow:visible;
  }

  /* poster / backdrop banner */
  .ticket-banner{
    position:relative;
    height:170px;
    border-radius:var(--radius) var(--radius) 0 0;
    overflow:hidden;
    background:linear-gradient(135deg,#2b2f3a,#11141b);
  }
  .ticket-banner img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .25s ease;
  }
  .ticket-banner img.loaded{opacity:1;}
  .ticket-banner .fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:6px;
    color:rgba(239,230,216,0.32);
    text-align:center;
    padding:10px;
  }
  .ticket-banner .fallback .ico{font-size:26px;}
  .ticket-banner .fallback .txt{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .ticket-banner .fallback .spin-mini{
    width:18px;height:18px;
    border-radius:50%;
    border:2px solid rgba(242,169,59,0.25);
    border-top-color:var(--marquee);
    animation:spin 0.9s linear infinite;
    margin-bottom:2px;
  }
  @media (prefers-reduced-motion: reduce){ .spin-mini{animation:spin 2.4s linear infinite;} }

  .ticket-head{
    padding:14px 18px 16px;
    position:relative;
  }
  .rank-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .badges-left{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .rank-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    background:var(--velvet);
    color:var(--cream);
    padding:4px 9px;
    border-radius:3px;
  }
  .age-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    background:rgba(24,19,16,0.08);
    color:var(--ink);
    border:1px solid rgba(24,19,16,0.2);
    padding:4px 8px;
    border-radius:3px;
  }
  .match-stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--teal);
    border:1.5px solid var(--teal);
    padding:3px 8px;
    border-radius:3px;
    transform:rotate(-3deg);
    white-space:nowrap;
  }
  .ticket h3{
    font-family:'Bebas Neue',cursive;
    font-size:26px;
    letter-spacing:0.3px;
    margin:2px 0 0;
    line-height:1.05;
  }
  .ticket .orig-title{
    font-size:12px;
    font-style:italic;
    color:#5a5148;
    margin:2px 0 0;
  }
  .meta-row{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:#5a5148;
    margin-top:8px;
    display:flex;flex-wrap:wrap;gap:10px;
  }
  .vibe-row{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-top:10px;
  }
  .vibe-chip{
    font-size:10.5px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--velvet);
    border:1px solid rgba(138,42,76,0.4);
    padding:3px 8px;
    border-radius:12px;
  }
  .tear-line{
    border-top:2px dashed rgba(24,19,16,0.22);
    margin:0 18px;
    position:relative;
  }
  .tear-line::before, .tear-line::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px;height:22px;
    background:var(--bg);
    border-radius:50%;
  }
  .tear-line::before{left:-29px;}
  .tear-line::after{right:-29px;}
  .ticket-body{
    padding:16px 18px 20px;
  }
  .ticket-body .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--velvet);
    margin:0 0 4px;
  }
  .ticket-body p{
    margin:0 0 14px;
    font-size:13.5px;
    line-height:1.5;
  }

  .ratings-row{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-bottom:12px;
  }
  .rating-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    padding:5px 10px;
    border-radius:6px;
    background:rgba(24,19,16,0.06);
    border:1px solid rgba(24,19,16,0.12);
  }
  .watch-chips{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-bottom:16px;
  }
  .watch-chip{
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    background:rgba(60,140,122,0.12);
    border:1px solid rgba(60,140,122,0.35);
    color:#1f4f44;
    padding:5px 10px;
    border-radius:14px;
    display:inline-flex;align-items:center;gap:5px;
  }

  .links-row{
    display:flex;gap:8px;flex-wrap:wrap;
    margin-top:2px;
  }
  .link-chip{
    font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;
    text-decoration:none;
    color:var(--ink);
    background:rgba(24,19,16,0.06);
    border:1px solid rgba(24,19,16,0.15);
    padding:6px 10px;
    border-radius:16px;
  }
  .link-chip:hover{background:rgba(24,19,16,0.12);}

  .interp-box{
    font-size:13px;
    color:var(--cream-dim);
    background:var(--bg-elev);
    border-left:2px solid var(--marquee);
    padding:12px 14px;
    border-radius:6px;
    margin-bottom:22px;
    line-height:1.5;
  }

  .disclaimer{
    font-size:11px;
    color:var(--cream-dim);
    opacity:0.65;
    line-height:1.5;
    margin-top:4px;
    text-align:center;
  }

  /* ---------- history ---------- */
  .hist-item{
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.1);
    border-radius:var(--radius);
    padding:13px 15px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .hist-item:hover{border-color:var(--marquee);}
  .hist-item .hd{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--cream-dim);
    margin-bottom:6px;
  }
  .hist-item .ht{
    font-size:13.5px;
    font-weight:600;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--cream-dim);
    font-size:13.5px;
  }

  .footer-space{flex:1;}

  /* ---------- landing / auth / admin ---------- */
  .landing-shell{padding:34px 0 18px;}
  .landing-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.8px;color:var(--marquee);text-transform:uppercase;margin-bottom:12px;}
  .landing-title{font-family:'Bebas Neue',cursive;font-size:54px;line-height:.92;letter-spacing:1px;margin:0 0 16px;color:var(--cream);}
  .landing-title span{color:var(--marquee);}
  .landing-copy{font-size:15px;line-height:1.65;color:var(--cream-dim);margin:0 0 24px;max-width:39ch;}
  .landing-actions{display:flex;flex-direction:column;gap:10px;margin-bottom:30px;}
  .landing-proof{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;}
  .proof-card{background:rgba(23,27,36,.82);border:1px solid rgba(239,230,216,.1);border-radius:var(--radius);padding:12px 10px;min-height:92px;}
  .proof-card strong{display:block;font-family:'Bebas Neue',cursive;color:var(--marquee);font-size:22px;letter-spacing:.5px;margin-bottom:5px;}
  .proof-card span{display:block;color:var(--cream-dim);font-size:11px;line-height:1.35;}

  /* ---------- landing sections: como funciona / confiança / planos / faq ---------- */
  .section{padding:40px 0 4px;border-top:1px solid rgba(239,230,216,.08);}
  .section-title{font-family:'Bebas Neue',cursive;font-size:30px;line-height:1.05;letter-spacing:.4px;margin:0 0 10px;color:var(--cream);}
  .section-copy{font-size:13.5px;line-height:1.6;color:var(--cream-dim);margin:0 0 22px;max-width:42ch;}

  .how-steps{display:flex;flex-direction:column;gap:12px;}

// Rota do backend. A chave OpenAI fica exclusivamente no servidor.

const LOADING_MESSAGES = [

// 1 crédito = 1 consulta (filme, série ou novela). Cobrança ainda não está

const PLANS = [
  {
    id: "silver",
    name: "Silver",
    price: "R$ 15",
    credits: "2 consultas por dia",
    perCredit: "a partir de R$ 0,25 por indicação",
    tagline: "Pra quem assiste no fim de semana",

  },
  {
    id: "gold",
    name: "Gold",

    tagline: "Pra quem assiste quase todo dia",
    badge: "MAIS ESCOLHIDO",
    highlight: true
  },
  {
    id: "diamante",
    name: "Diamante",
    price: "R$ 30",
    credits: "Consultas ilimitadas",
    perCredit: "sem limite dentro do ciclo de 30 dias",
    tagline: "Pra quem vive maratonando",
    badge: "MELHOR CUSTO-BENEFÍCIO"
  }
];

let sessionUser = null;
let authError = "";
let adminStatus = null;
let authMode = "login";
let selectedPlanId = null;
let accessStatus = null;
let pendingStatusTimer = null;
let pendingAccess = null;
try{
  pendingAccess = JSON.parse(window.localStorage.getItem("pipoca_pending_access") || "null");
}catch(e){
  pendingAccess = null;
}

let state = {
  screen: "landing", // landing | login | wizard | summary | loading | results | history | admin | error
  stepIndex: 0,
  filters: {},
  interpretation: "",
  bestChoice: null,
  recommendations: [],
  errorMsg: "",
  historyList: null,
  viewingHistoryItem: null,
  loadingMessage: "",
  paywallMessage: ""
};

async function bootstrapAuth(){
  try{
    const response = await fetch("/api/auth/me", { credentials: "same-origin" });
    const data = await response.json();
    if(data.authenticated){
      sessionUser = data.user;
      state.screen = sessionUser.role === "admin" ? "admin" : "wizard";
    }else if(pendingAccess && pendingAccess.email && pendingAccess.token){
      state.screen = "access-status";
      checkPendingAccess(true);
    }
  }catch(e){
    // A landing page continua disponível mesmo quando a API está temporariamente fora.
  }
  render();
  if(sessionUser && sessionUser.role === "admin") await openAdmin();
}

function setPendingAccess(data, planId){
  pendingAccess = { email: data.email, token: data.token, planId: planId || null };
  accessStatus = data.status || "pending";
  try{ window.localStorage.setItem("pipoca_pending_access", JSON.stringify(pendingAccess)); }catch(e){}
}

async function startCheckout(planId, email, token){
  try{
    const payload = { plan_id: planId };
    if(email && token){ payload.email = email; payload.token = token; }
    const response = await fetch("/api/billing/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok || !data.checkout_url) throw new Error(data.error || "Não foi possível iniciar o pagamento agora.");
    window.location.href = data.checkout_url;
  }catch(e){
    const message = e.message || "Não foi possível iniciar o pagamento agora.";
    if(state.screen === "paywall"){
      state.paywallMessage = message;
      render();
    }else{
      authError = message;
      state.screen = "access-status";
      render();
    }
  }
}

function clearPendingAccess(){
  pendingAccess = null;
  accessStatus = null;
  try{ window.localStorage.removeItem("pipoca_pending_access"); }catch(e){}
  if(pendingStatusTimer){ clearTimeout(pendingStatusTimer); pendingStatusTimer = null; }
}

async function checkPendingAccess(shouldRender = true){
  if(!pendingAccess || !pendingAccess.email || !pendingAccess.token) return;
  try{
    const query = "?email=" + encodeURIComponent(pendingAccess.email) + "&token=" + encodeURIComponent(pendingAccess.token);
    const response = await fetch("/api/auth/status" + query, { credentials: "same-origin", cache: "no-store" });
    const data = await response.json().catch(() => ({}));
    if(response.ok && data.status){
      accessStatus = data.status;
      if(accessStatus !== "pending") pendingStatusTimer = null;
      if(shouldRender && state.screen === "access-status") render();
      if(accessStatus === "pending" && state.screen === "access-status") pendingStatusTimer = setTimeout(() => checkPendingAccess(true), 15000);
      return;
    }
  }catch(e){}
  if(accessStatus === "pending" && state.screen === "access-status") pendingStatusTimer = setTimeout(() => checkPendingAccess(true), 15000);
}

async function login(email, password){
  authError = "";
  try{
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ email, password })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "Não foi possível entrar agora.");
    clearPendingAccess();
    sessionUser = data.user;
    state.screen = sessionUser.role === "admin" ? "admin" : "wizard";
    render();
    if(sessionUser.role === "admin") await openAdmin();
  }catch(e){
    authError = e.message || "Não foi possível entrar agora.";
    render();
  }
}

async function register(email, password, confirmation){
  authError = "";
  try{
    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, confirmation })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "Não foi possível enviar o cadastro agora.");
    const chosenPlan = selectedPlanId;
    setPendingAccess(data, chosenPlan);
    authMode = "login";
    if(chosenPlan){
      state.loadingMessage = "Preparando seu pagamento seguro…";
      state.screen = "loading";
      render();
      await startCheckout(chosenPlan, data.email, data.token);
      state.loadingMessage = "";
    }else{
      state.screen = "access-status";
      render();
      checkPendingAccess(false);
    }
  }catch(e){
    authError = e.message || "Não foi possível enviar o cadastro agora.";
    render();
  }
}

async function logout(){
  try{ await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); }catch(e){}
  sessionUser = null;
  adminStatus = null;
  selectedPlanId = null;
  clearPendingAccess();
  state.screen = "landing";
  state.stepIndex = 0;
  state.filters = {};
  render();
}

async function openAdmin(){
  if(!sessionUser || sessionUser.role !== "admin") return;
  try{
    const response = await fetch("/api/admin/status", { credentials: "same-origin", cache: "no-store" });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Acesso negado.");
    adminStatus = data;
    state.screen = "admin";
    render();
  }catch(e){
    authError = e.message || "Não foi possível abrir o painel.";
    state.screen = "wizard";
    render();
  }
}

async function adminAction(userId, action){
  if(action === "delete" && !window.confirm("Excluir este usuário definitivamente?")) return;
  authError = "";
  try{
    const response = await fetch("/api/admin/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ user_id: userId, action })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "Não foi possível atualizar o cadastro.");
    adminStatus = { ...adminStatus, summary: data.summary, users: data.users };
    render();
  }catch(e){
    authError = e.message || "Não foi possível atualizar o cadastro.";
    render();
  }
}

/* =========================================================
   PIPOCA DE FUNDO — enche a tela conforme o progresso
   ========================================================= */
function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

const rng = seededRandom(1337);
const POPCORN_COUNT = 170;
const POPCORN_KERNELS = [];
for(let i = 0; i < POPCORN_COUNT; i++){
  const r1 = rng(), r2 = rng(), r3 = rng(), r4 = rng(), r5 = rng();
  // tiers: pequenas ao fundo (mais comuns), médias flutuando, grandes em foco (mais raras)
  let tier, size;
  if(r5 < 0.40){ tier = "small";  size = 9 + r3 * 6;  }
  else if(r5 < 0.85){ tier = "medium"; size = 17 + r3 * 9; }
  else { tier = "large"; size = 27 + r3 * 9; }

  POPCORN_KERNELS.push({
    x: r1 * 100,
    y: Math.pow(r2, 1.35) * 100, // mais denso perto do topo, rareando conforme desce
    size: size,
    rot: r4 * 360,
    tier: tier
  });
}

const kernelEls = new Map(); // idx -> elemento no DOM

function popcornLevel(){
  // fração de 0 a 1 de quanto a tela deve estar "cheia" de pipoca, de cima para baixo
  if(state.screen === "wizard"){
    return state.stepIndex / STEPS.length;
  }
  // summary, loading, results, history, error: já respondeu tudo
  return 1;
}

function buildKernelEl(k){
  const el = document.createElement("div");
  el.className = "kernel tier-" + k.tier;
  el.style.left = k.x.toFixed(2) + "%";
  el.style.top = k.y.toFixed(2) + "%";
  el.style.width = k.size.toFixed(1) + "px";
  el.style.height = (k.size * 0.86).toFixed(1) + "px";
  el.style.setProperty("--rot", k.rot.toFixed(1) + "deg");

  const p1 = document.createElement("span");
  p1.className = "petal p1";
  const p2 = document.createElement("span");
  p2.className = "petal p2";
  const p3 = document.createElement("span");
  p3.className = "petal p3";
  const core = document.createElement("span");
  core.className = "core";

  el.appendChild(p1);
  el.appendChild(p2);
  el.appendChild(p3);
  el.appendChild(core);
  return el;
}

function syncPopcorn(){
  const container = document.getElementById("popcorn-bg");
  if(!container) return;
  const thresholdY = popcornLevel() * 100;

  POPCORN_KERNELS.forEach((k, idx) => {
    const shouldShow = k.y <= thresholdY;
    const exists = kernelEls.has(idx);

    if(shouldShow && !exists){
      const el = buildKernelEl(k);
      container.appendChild(el);
      kernelEls.set(idx, el);
    } else if(!shouldShow && exists){
      kernelEls.get(idx).remove();
      kernelEls.delete(idx);
    }
  });
}

async function getRecommendations(filters){
  const response = await fetch(RECOMMENDATION_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filters })
  });
  if(!response.ok){
    const error = await response.json().catch(() => ({}));
    const err = new Error(error.error || "Falha ao consultar o motor de recomendação (HTTP " + response.status + ").");
    if(response.status === 402) err.paymentRequired = true;
    throw err;
  }
  const data = await response.json();
  const text = data.text || "";
  const clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
  let parsed;
  try{
    parsed = JSON.parse(clean);
  }catch(e){
    throw new Error("Não consegui interpretar a resposta do motor de recomendação. Tente novamente.");
  }
  if(!parsed.recommendations || !Array.isArray(parsed.recommendations) || parsed.recommendations.length === 0){
    throw new Error("O motor de recomendação não retornou resultados válidos.");
  }
  return parsed;
}

/* =========================================================
   PÔSTERES REAIS — via Wikipedia REST API (sem chave)
   O modelo não consegue prever URLs de imagem válidas,
   então buscamos a imagem real do filme depois de ter o título.
   ========================================================= */
function upscaleWikiThumb(src){
  // ".../thumb/x/xx/Nome.jpg/220px-Nome.jpg" -> pede uma versão maior
  return src.replace(/\/\d+px-/, "/500px-");
}

async function wikiSummaryThumb(title, lang){
  try{
    const endpoint = "https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title);
    const res = await fetch(endpoint, { headers: { "accept": "application/json" } });
    if(!res.ok) return null;
    const data = await res.json();
    if(data.type === "disambiguation") return null;
    if(data.thumbnail && data.thumbnail.source){
      return upscaleWikiThumb(data.thumbnail.source);
    }
    return null;
  }catch(e){
    return null;
  }
}

async function fetchPosterUrl(rec){
  const original = (rec.title_original || rec.title_pt || "").trim();
  const pt = (rec.title_pt || rec.title_original || "").trim();
  const year = rec.year;
  if(!original && !pt) return "";

  const candidates = [];
  if(original){
    if(year) candidates.push(original + " (" + year + " film)");
    candidates.push(original + " (film)");
    candidates.push(original);
  }
  if(pt && pt !== original){
    candidates.push(pt);
  }

  for(const lang of ["en","pt"]){
    for(const c of candidates){
      const url = await wikiSummaryThumb(c, lang);
      if(url) return url;
    }
  }
  return "";
}

/* ---------- storage helpers ---------- */
function browserStorage(){
  if(window.storage && typeof window.storage.set === "function" && typeof window.storage.list === "function"){
    return {
      async set(key, value){ await window.storage.set(key, value, false); },
      async list(prefix){ return await window.storage.list(prefix, false); },
      async get(key){ return await window.storage.get(key, false); }
    };
  }
  return {
    async set(key, value){ window.localStorage.setItem(key, value); },
    async list(prefix){ return { keys: Object.keys(window.localStorage).filter(key => key.startsWith(prefix)) }; },
    async get(key){ return { value: window.localStorage.getItem(key) }; }
  };
}

async function saveToHistory(record){
  try{
    const key = "search:" + record.created_at;
    await browserStorage().set(key, JSON.stringify(record));
  }catch(e){ /* best-effort, non-blocking */ }
}

async function loadHistory(){
  try{
    const storage = browserStorage();
    const listing = await storage.list("search:");
    const keys = (listing && listing.keys) ? listing.keys.slice().sort().reverse() : [];
    const items = [];
    for(const k of keys){
      try{
        const r = await storage.get(k);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){}
    }
    return items;
  }catch(e){
    return [];
  }
}

        ? "Estamos aguardando a confirmação do seu pagamento (" + plan.name + " · " + plan.price + "/mês). Pix costuma confirmar em segundos; cartão pode levar um pouco mais. Esta tela atualiza sozinha."
        : "O seu acesso será liberado assim que o administrador validar. Por favor, aguarde a liberação. Esta tela será atualizada automaticamente.";
  const email = document.createElement("div");
  email.className = "status-email";
  email.textContent = pendingAccess && pendingAccess.email ? pendingAccess.email : "";
  wrap.appendChild(icon);
  wrap.appendChild(title);
  if(plan && authError){
    const error = document.createElement("div");
    error.className = "auth-error";
    error.textContent = authError;
    wrap.appendChild(error);
  }else{
    wrap.appendChild(copy);
  }
  wrap.appendChild(email);

  const actions = document.createElement("div");
  actions.className = "status-actions";
  if(status === "pending"){
    if(!(plan && authError)){
      const refresh = document.createElement("button");
      refresh.className = "cta small";
      refresh.textContent = "Verificar agora";
      refresh.onclick = () => checkPendingAccess(true);
      actions.appendChild(refresh);
    }
    if(plan){
      const retryPayment = document.createElement("button");
      retryPayment.className = "cta" + (authError ? "" : " secondary") + " small";
      retryPayment.textContent = authError ? "Tentar pagamento de novo" : "Pagar de novo";
      retryPayment.onclick = () => { authError = ""; startCheckout(plan.id, pendingAccess.email, pendingAccess.token); };
      actions.appendChild(retryPayment);
    }
  }else if(status === "approved"){
    const enter = document.createElement("button");
    enter.className = "cta small";
    enter.textContent = "Entrar na plataforma";
    enter.onclick = () => { clearPendingAccess(); authMode = "login"; state.screen = "login"; render(); };
    actions.appendChild(enter);
  }else{
    const retry = document.createElement("button");
    retry.className = "cta small";
    retry.textContent = "Fazer novo cadastro";
    retry.onclick = () => { clearPendingAccess(); authMode = "register"; authError = ""; state.screen = "login"; render(); };
    actions.appendChild(retry);
  }
  const back = document.createElement("button");
  back.className = "cta secondary small";
  back.textContent = "Voltar para a apresentação";
  back.onclick = () => { state.screen = "landing"; render(); };
  actions.appendChild(back);
  wrap.appendChild(actions);
  return wrap;
}

function formatUserDate(value){
  if(!value) return "";
  try{ return new Date(value).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); }
  catch(e){ return value; }
}

async function runSearch(){
  state.screen = "loading";
  render();
  try{
    const result = await getRecommendations(state.filters);

    // busca os pôsteres reais antes de mostrar os cards
    await Promise.all(result.recommendations.map(async rec => {
      if(rec.poster_url) return;
      try{
        const poster = await fetchPosterUrl(rec);
        rec.poster_url = poster || "";
      }catch(e){
        rec.poster_url = "";
      }
    }));

    state.interpretation = result.interpretation || "";
    state.bestChoice = result.best_choice || null;
    state.recommendations = result.recommendations;
    state.screen = "results";
    render();

    const record = {
      filters: { ...state.filters },
      interpretation: state.interpretation,
      bestChoice: state.bestChoice,
      recommendations: state.recommendations,
      prompt_version: PROMPT_VERSION,
      created_at: new Date().toISOString()
    };
    saveToHistory(record);
  }catch(e){
    if(e.paymentRequired){
      state.paywallMessage = e.message || "Assine um plano para continuar buscando recomendações.";
      state.screen = "paywall";
      render();
      return;
    }
    state.errorMsg = e.message || "Não consegui buscar recomendações agora.";
    state.screen = "error";
    render();
  }
}

function renderTicket(rec){

  const l1 = document.createElement("div");

  l2.className = "label";
  l2.textContent = "POR QUE COMBINA";

  body.appendChild(p1);
  body.appendChild(l2);
  body.appendChild(p2);

  /* ratings — cada item vem de uma fonte externa real (nunca da IA); nunca misturar escalas numa mesma pill */

    const ratingsRow = document.createElement("div");

      ratingsRow.appendChild(pill);

    if(ratingsRow.childNodes.length) body.appendChild(ratingsRow);

  /* where to watch */
      if(rec.where_to_watch && rec.where_to_watch.length){

    wl.className = "label";
    wl.textContent = "ONDE ASSISTIR";
    body.appendChild(wl);

      if(!w.platform) return;
      const chip = document.createElement("span");
      chip.className = "watch-chip";
      const icon = WATCH_TYPE_ICON[w.type] || "🎬";
      const label = WATCH_TYPE_LABEL[w.type] || "";

  });
  body.appendChild(links);

  t.appendChild(banner);
  t.appendChild(head);
  t.appendChild(tear);
  t.appendChild(body);
  return t;

    if(item.interpretation){
      const box = document.createElement("div");
      box.className = "interp-box";
      box.textContent = item.interpretation;
      wrap.appendChild(box);
    }
    if(item.bestChoice && item.bestChoice.title_pt){
      const hero = document.createElement("div");
      hero.className = "hero-pick";
      hero.innerHTML = '<div class="hp-eyebrow">🍿 Melhor pedida de hoje</div><div class="hp-title">' +
        escapeHtml(item.bestChoice.title_pt) + '</div><p class="hp-reason">' +
        escapeHtml(item.bestChoice.reason || "") + '</p>';
      wrap.appendChild(hero);
    }
    const hint = document.createElement("p");
    hint.className = "scroll-hint";
    hint.textContent = "◀ arraste para o lado para ver as 3 opções ▶";
    wrap.appendChild(hint);

    const scrollRow = document.createElement("div");
    scrollRow.className = "tickets-scroll";
    item.recommendations
      .slice()
      .sort((a,b) => (b.match_score||0) - (a.match_score||0))
      .forEach(rec => scrollRow.appendChild(renderTicket(rec)));
    wrap.appendChild(scrollRow);
    return wrap;
  }

  if(!state.historyList || state.historyList.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Nenhuma busca ainda. Suas próximas recomendações vão aparecer aqui.";
    wrap.appendChild(empty);
    return wrap;
  }

  state.historyList.forEach(item => {
    const el = document.createElement("div");
    el.className = "hist-item";
    const hd = document.createElement("div");
    hd.className = "hd";
    const date = new Date(item.created_at);
    hd.textContent = date.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric" }) +
      " · " + date.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
    const ht = document.createElement("div");
    ht.className = "ht";
    ht.textContent = (item.filters.genre || "") + " · " + (item.filters.mood || "");
    el.appendChild(hd);
    el.appendChild(ht);
    el.onclick = () => { state.viewingHistoryItem = item; render(); };
    wrap.appendChild(el);
  });

  return wrap;
}

function escapeHtml(str){
  if(str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

render();
bootstrapAuth();
</script>
</body>
</html>
