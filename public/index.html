<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipoca & Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1218;
    --bg-elev:#171B24;
    --bg-elev-2:#1E2330;
    --marquee:#F2A93B;
    --marquee-dim:#8A6A2E;
    --velvet:#8A2A4C;
    --cream:#EFE6D8;
    --cream-dim:#C9BFAF;
    --teal:#3C8C7A;
    --ink:#181310;
    --danger:#C4553D;
    --gold:#C9992E;
    --radius:10px;
    --max:460px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ambient popcorn background ---------- */
  #popcorn-bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    background:var(--bg);
    /* Toda palavra deste app vive dentro da coluna central (--max).
       Por isso a pipoca perto/atrás do texto cai para ~10% de opacidade,
       preservando contraste e leitura em qualquer ponto de rolagem. */
    mask-image: linear-gradient(90deg,
      black 0,
      black calc(50% - 270px),
      rgba(0,0,0,0.1) calc(50% - 230px),
      rgba(0,0,0,0.1) calc(50% + 230px),
      black calc(50% + 270px),
      black 100%
    );
    -webkit-mask-image: linear-gradient(90deg,
      black 0,
      black calc(50% - 270px),
      rgba(0,0,0,0.1) calc(50% - 230px),
      rgba(0,0,0,0.1) calc(50% + 230px),
      black calc(50% + 270px),
      black 100%
    );
    mask-repeat:no-repeat;
    -webkit-mask-repeat:no-repeat;
  }
  #popcorn-bg::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(242,169,59,0.10), transparent 55%),
      linear-gradient(180deg, rgba(15,18,24,0.30) 0%, rgba(15,18,24,0.66) 55%, rgba(15,18,24,0.90) 100%);
    pointer-events:none;
  }

  /* ---------- realistic popcorn kernel (butterfly-type, multi-lobe) ---------- */
  .kernel{
    position:absolute;
    transform:translateY(-46px) rotate(var(--rot,0deg)) scale(0.6);
    opacity:0;
    animation:fallIn .6s cubic-bezier(.22,.9,.4,1.15) both;
  }
  .kernel.tier-large{ z-index:3; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.28)); }
  .kernel.tier-medium{ z-index:2; opacity:0.95; }
  .kernel.tier-small{ z-index:1; filter:blur(0.4px); opacity:0.8; }

  .kernel .petal{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 32% 26%, #FDFDFD 0%, #F4EFEA 55%, #C5BBB1 100%);
    box-shadow:
      inset -3px -3px 4px rgba(140,70,17,0.20),
      inset 2px 2px 3px rgba(255,255,255,0.65),
      0 1px 2px rgba(0,0,0,0.22);
  }
  .kernel .p1{ border-radius:58% 42% 63% 37% / 47% 58% 42% 53%; }
  .kernel .p2{ border-radius:40% 60% 45% 55% / 60% 40% 62% 38%; transform:rotate(35deg) scale(0.82); }
  .kernel .p3{ border-radius:65% 35% 40% 60% / 40% 55% 45% 60%; transform:rotate(-28deg) scale(0.7); }
  .kernel .core{
    position:absolute;
    width:38%; height:34%;
    left:30%; top:40%;
    border-radius:50% 50% 55% 45% / 55% 45% 55% 45%;
    background:radial-gradient(circle at 35% 28%, #F2AA4C 0%, #D9822B 55%, #8C4611 100%);
    box-shadow:0 0 4px rgba(242,170,76,0.55), inset -1px -1px 2px rgba(140,70,17,0.55);
  }

  @keyframes fallIn{
    0%{ transform:translateY(-46px) rotate(var(--rot,0deg)) scale(0.6); opacity:0; }
    62%{ transform:translateY(8px) rotate(var(--rot,0deg)) scale(1.06); opacity:1; }
    100%{ transform:translateY(0) rotate(var(--rot,0deg)) scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .kernel{animation:none;opacity:1;transform:translateY(0) rotate(var(--rot,0deg)) scale(1);}
  }

  #app{
    position:relative;
    z-index:1;
    max-width:var(--max);
    margin:0 auto;
    padding:20px 16px 96px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Marquee header ---------- */
  .marquee{
    text-align:center;
    padding:18px 10px 22px;
    position:relative;
  }
  .marquee-bulbs{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:10px;
  }
  .bulb{
    width:6px;height:6px;border-radius:50%;
    background:var(--marquee);
    box-shadow:0 0 6px 1px rgba(242,169,59,0.7);
    animation:flicker 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .bulb{animation:none;opacity:0.9;} }
  .bulb:nth-child(odd){animation-delay:0.4s;}
  .bulb:nth-child(3n){animation-delay:0.9s;}
  @keyframes flicker{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }
  .marquee h1{
    font-family:'Bebas Neue',cursive;
    font-size:44px;
    letter-spacing:3px;
    margin:0;
    color:var(--marquee);
    line-height:0.95;
    text-shadow:0 0 18px rgba(242,169,59,0.25);
  }
  .marquee p{
    margin:6px 0 0;
    font-size:12.5px;
    color:var(--cream-dim);
    letter-spacing:0.5px;
    font-family:'IBM Plex Mono',monospace;
  }

  .header-shield{
    position:relative;
    margin:-20px -16px 0;
    padding:20px 16px 4px;
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    background:linear-gradient(180deg, rgba(15,18,24,0.62) 0%, rgba(15,18,24,0.30) 75%, rgba(15,18,24,0) 100%);
  }

  /* ---------- top nav ---------- */
  .topnav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--cream-dim);
  }
  .topnav > span:first-child{flex:none;}
  .topnav button{
    background:none;border:1px solid rgba(239,230,216,0.18);
    color:var(--cream-dim);
    padding:6px 10px;
    border-radius:20px;
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
    white-space:nowrap;
    transition:border-color .15s, color .15s;
  }
  .topnav button:hover{border-color:var(--marquee);color:var(--marquee);}

  /* ---------- progress dots (film perforation) ---------- */
  .perf{
    display:flex;
    gap:6px;
    justify-content:center;
    margin:22px 0 26px;
  }
  .perf span{
    width:9px;height:9px;border-radius:2px;
    background:var(--bg-elev-2);
    border:1px solid rgba(239,230,216,0.15);
  }
  .perf span.done{background:var(--marquee);border-color:var(--marquee);}
  .perf span.now{background:var(--velvet);border-color:var(--velvet);}

  /* ---------- step card ---------- */
  .step-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--marquee);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .step-question{
    font-family:'Bebas Neue',cursive;
    font-size:30px;
    letter-spacing:0.5px;
    line-height:1.05;
    margin:0 0 18px;
    color:var(--cream);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .opt{
    text-align:left;
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.10);
    color:var(--cream);
    padding:13px 16px;
    border-radius:var(--radius);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:hover{border-color:var(--marquee);background:var(--bg-elev-2);}
  .opt:active{transform:scale(0.99);}
  .opt.selected{
    border-color:var(--marquee);
    background:linear-gradient(90deg, rgba(242,169,59,0.14), rgba(242,169,59,0.04));
  }

  /* Pergunta com marcação múltipla: logo à esquerda, visto à direita. */
  .opt.multi{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .opt-logo{
    flex:0 0 auto;
    width:72px;
    display:block;
    line-height:0;
  }
  .opt-logo svg{
    width:100%;
    height:auto;
    display:block;
    border-radius:6px;
  }
  .opt-label{flex:1;}
  .opt-check{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    border:1px solid rgba(239,230,216,0.22);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    color:var(--bg);
  }
  .opt.selected .opt-check{
    background:var(--marquee);
    border-color:var(--marquee);
  }
  .step-hint{
    font-size:12.5px;
    color:var(--cream-dim);
    line-height:1.5;
    margin:-10px 0 14px;
  }
  .step-notice{
    font-size:12.5px;
    color:var(--marquee);
    line-height:1.5;
    margin:12px 0 0;
  }
  .multi-continue{margin-top:16px;}
  .multi-continue[disabled]{opacity:.45;cursor:not-allowed;}

  /* Contato rápido: fica fora do #app, então sobrevive a cada render(). */
  .wa-fab{
    position:fixed;
    right:16px;
    bottom:calc(16px + env(safe-area-inset-bottom, 0px));
    z-index:60;
    width:56px;height:56px;
    border-radius:50%;
    background:#25d366;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(0,0,0,0.38);
    text-decoration:none;
    transition:transform .15s, box-shadow .15s;
  }
  .wa-fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,0.48);}
  .wa-fab:active{transform:scale(0.95);}
  .wa-fab svg{width:31px;height:31px;fill:#fff;display:block;}

  .back-link{
    margin-top:18px;
    background:none;border:none;
    color:var(--cream-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
    padding:6px 0;
  }
  .back-link:hover{color:var(--marquee);}

  /* ---------- summary ---------- */
  .summary-list{
    display:flex;flex-wrap:wrap;gap:8px;
    margin:4px 0 22px;
  }
  .tag{
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.14);
    padding:7px 12px;
    border-radius:20px;
    font-size:12.5px;
    color:var(--cream-dim);
  }
  .tag b{color:var(--cream);font-weight:600;}

  .cta{
    width:100%;
    background:var(--marquee);
    color:var(--ink);
    border:none;
    padding:15px 18px;
    border-radius:var(--radius);
    font-family:'Bebas Neue',cursive;
    font-size:19px;
    letter-spacing:1px;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .cta:hover{filter:brightness(1.08);}
  .cta:active{transform:scale(0.985);}
  .cta.secondary{
    background:none;
    border:1px solid rgba(239,230,216,0.25);
    color:var(--cream);
  }
  .cta.small{padding:11px 14px;font-size:15px;}

  /* ---------- loading ---------- */
  .loading{
    text-align:center;
    padding:60px 10px;
  }
  .reel{
    width:46px;height:46px;margin:0 auto 18px;
    border-radius:50%;
    border:3px solid rgba(242,169,59,0.2);
    border-top-color:var(--marquee);
    animation:spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .reel{animation:spin 2.4s linear infinite;} }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{
    font-family:'IBM Plex Mono',monospace;
    color:var(--cream-dim);
    font-size:13px;
  }

  /* ---------- error ---------- */
  .error-box{
    background:rgba(196,85,61,0.12);
    border:1px solid rgba(196,85,61,0.4);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    font-size:13.5px;
    color:var(--cream);
  }

  /* ---------- results ---------- */
  .results-header{
    font-family:'Bebas Neue',cursive;
    font-size:26px;
    letter-spacing:0.5px;
    margin:0 0 4px;
  }
  .results-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--cream-dim);
    margin:0 0 20px;
  }

  /* ---------- hero pick ---------- */
  .hero-pick{
    border:1px solid rgba(242,169,59,0.35);
    background:linear-gradient(135deg, rgba(242,169,59,0.10), rgba(138,42,76,0.08));
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:26px;
  }
  .hero-pick .hp-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--marquee);
    margin-bottom:6px;
  }
  .hero-pick .hp-title{
    font-family:'Bebas Neue',cursive;
    font-size:24px;
    letter-spacing:0.3px;
    margin:0 0 6px;
  }
  .hero-pick .hp-reason{
    font-size:13px;
    color:var(--cream-dim);
    line-height:1.5;
    margin:0;
  }

  /* ---------- horizontal ticket carousel ---------- */
  .scroll-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    color:var(--cream-dim);
    text-align:center;
    margin:0 0 12px;
    opacity:0.75;
  }
  .tickets-scroll{
    display:flex;
    gap:16px;
    overflow-x:auto;
    overflow-y:visible;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    margin:0 -16px 8px;
    padding:4px 16px 20px;
    scrollbar-width:thin;
    scrollbar-color:var(--marquee-dim) transparent;
  }
  .tickets-scroll::-webkit-scrollbar{height:6px;}
  .tickets-scroll::-webkit-scrollbar-track{background:transparent;}
  .tickets-scroll::-webkit-scrollbar-thumb{background:var(--marquee-dim);border-radius:3px;}
  .tickets-scroll .ticket{
    flex:0 0 82vw;
    max-width:300px;
    scroll-snap-align:start;
    margin-bottom:0;
  }

  .ticket{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:var(--radius);
    overflow:visible;
  }

  /* poster / backdrop banner */
  .ticket-banner{
    position:relative;
    height:170px;
    border-radius:var(--radius) var(--radius) 0 0;
    overflow:hidden;
    background:linear-gradient(135deg,#2b2f3a,#11141b);
  }
  .ticket-banner img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .25s ease;
  }
  .ticket-banner img.loaded{opacity:1;}
  .ticket-banner .fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:6px;
    color:rgba(239,230,216,0.32);
    text-align:center;
    padding:10px;
  }
  .ticket-banner .fallback .ico{font-size:26px;}
  .ticket-banner .fallback .txt{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .ticket-banner .fallback .spin-mini{
    width:18px;height:18px;
    border-radius:50%;
    border:2px solid rgba(242,169,59,0.25);
    border-top-color:var(--marquee);
    animation:spin 0.9s linear infinite;
    margin-bottom:2px;
  }
  @media (prefers-reduced-motion: reduce){ .spin-mini{animation:spin 2.4s linear infinite;} }

  .ticket-head{
    padding:14px 18px 16px;
    position:relative;
  }
  .rank-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  /* Com o selo de formato são quatro etiquetas: se a linha quebrar, o
     MATCH continua encostado à direita em vez de cair no canto esquerdo. */
  .rank-row .match-stamp{margin-left:auto;}
  .badges-left{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .rank-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    background:var(--velvet);
    color:var(--cream);
    padding:4px 9px;
    border-radius:3px;
  }
  .kind-badge{
    font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.9px;
    padding:5px 7px;border-radius:4px;background:#2b3a52;color:#f4efe6;white-space:nowrap;
  }
  .kind-badge.serie{background:#5a3a6b;}
  .age-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    background:rgba(24,19,16,0.08);
    color:var(--ink);
    border:1px solid rgba(24,19,16,0.2);
    padding:4px 8px;
    border-radius:3px;
  }
  .match-stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--teal);
    border:1.5px solid var(--teal);
    padding:3px 8px;
    border-radius:3px;
    transform:rotate(-3deg);
    white-space:nowrap;
  }
  .ticket h3{
    font-family:'Bebas Neue',cursive;
    font-size:26px;
    letter-spacing:0.3px;
    margin:2px 0 0;
    line-height:1.05;
  }
  .ticket .orig-title{
    font-size:12px;
    font-style:italic;
    color:#5a5148;
    margin:2px 0 0;
  }
  .meta-row{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:#5a5148;
    margin-top:8px;
    display:flex;flex-wrap:wrap;gap:10px;
  }
  .vibe-row{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-top:10px;
  }
  .vibe-chip{
    font-size:10.5px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--velvet);
    border:1px solid rgba(138,42,76,0.4);
    padding:3px 8px;
    border-radius:12px;
  }
  .tear-line{
    border-top:2px dashed rgba(24,19,16,0.22);
    margin:0 18px;
    position:relative;
  }
  .tear-line::before, .tear-line::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px;height:22px;
    background:var(--bg);
    border-radius:50%;
  }
  .tear-line::before{left:-29px;}
  .tear-line::after{right:-29px;}
  .ticket-body{
    padding:16px 18px 20px;
  }
  .ticket-body .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--velvet);
    margin:0 0 4px;
  }
  .ticket-body p{
    margin:0 0 14px;
    font-size:13.5px;
    line-height:1.5;
  }

  /* São nove fontes de avaliação: em coluna única o ingresso ficaria alto
     demais, então elas ocupam a largura disponível em duas ou mais colunas. */
  .ratings-row{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(118px, 1fr));
    gap:6px;
    margin-bottom:12px;
  }
  .rating-pill{
    font-family:'IBM Plex Mono',monospace;
    padding:6px 8px;
    border-radius:6px;
    background:rgba(24,19,16,0.06);
    border:1px solid rgba(24,19,16,0.12);
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1px;
    white-space:nowrap;
  }
  /* Nome da fonte em cima, nota embaixo: assim "Mercado Livre" e
     "Tomatômetro" cabem inteiros na coluna estreita do ingresso. */
  .rating-pill .rating-name{
    font-size:9px;
    font-weight:600;
    letter-spacing:0.4px;
    text-transform:uppercase;
    opacity:0.68;
  }
  .rating-pill .rating-value{
    font-size:12.5px;
    font-weight:700;
  }
  .awards-row{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;
    color:var(--gold);
    background:rgba(201,153,46,0.12);
    border:1px solid rgba(201,153,46,0.35);
    padding:7px 10px;
    border-radius:6px;
    margin-bottom:14px;
  }

  .watch-chips{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-bottom:16px;
  }
  .watch-chip{
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    background:rgba(60,140,122,0.12);
    border:1px solid rgba(60,140,122,0.35);
    color:#1f4f44;

  }
</style>

  svg.setAttribute("viewBox", "0 0 120 40");

  const rect = document.createElementNS(SVG_NS, "rect");
  rect.setAttribute("width", "120");
  rect.setAttribute("height", "40");
  rect.setAttribute("rx", "8");
  rect.setAttribute("fill", brand.bg);

  const text = document.createElementNS(SVG_NS, "text");

async function apiFetch(url, options){
  const response = await fetch(url, Object.assign({ credentials: "same-origin", cache: "no-store" }, options || {}));
  const data = await response.json().catch(() => ({}));
  if(!response.ok){
    const error = new Error(data.error || "Não foi possível concluir a operação agora.");
    error.code = data.code || "";
    error.status = response.status;
    error.payload = data;
    throw error;
  }
  return data;
}

/* ---------- marcações ---------- */
function markKey(item){
  const base = String(item.title_original || "").trim() || String(item.title_pt || "").trim();
  const slug = base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  const year = parseInt(item.year, 10) || 0;
  return slug ? slug + ":" + year : "";
}

function indexMarks(list){
  marks = Array.isArray(list) ? list : [];
  marksIndex = {};
  marks.forEach(item => {
    const key = markKey(item);
    if(key) marksIndex[key] = item;
  });
}

async function loadMarks(){
  try{
    const data = await apiFetch("/api/feedback");
    indexMarks(data.feedback);
    marksError = "";
  }catch(e){
    if(e.status !== 401) marksError = e.message;
  }
  return marks;
}

function markFor(rec){
  return marksIndex[markKey(rec)] || null;
}

/* Alterna gostei / não gostei / já assisti e grava na conta do usuário. */
async function toggleMark(rec, kind, buttons){
  const current = markFor(rec) || { opinion: "", watched: false };
  const next = {
    title_pt: rec.title_pt || rec.title_original || "",
    title_original: rec.title_original || "",
    year: parseInt(rec.year, 10) || 0,
    opinion: current.opinion || "",
    watched: !!current.watched
  };
  if(kind === "watched") next.watched = !next.watched;
  else next.opinion = current.opinion === kind ? "" : kind;

  (buttons || []).forEach(button => { button.disabled = true; });
  try{
    const data = await apiFetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(next)
    });
    indexMarks(data.feedback);
    marksError = "";
  }catch(e){
    marksError = e.message;
  }
  render();
}

async function removeMark(id){
  try{
    const data = await apiFetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "remove", id })
    });
    indexMarks(data.feedback);
    marksError = "";
  }catch(e){
    marksError = e.message;
  }
  render();
}

async function submitCheckout(planId, name, document_){

    });

    }
  }catch(e){
    checkout.submitting = false;
    checkout.error = e.message;
    render();
  }
}

let billingTimer = null;
function startBillingPolling(){
  if(billingTimer) window.clearTimeout(billingTimer);
  checkout.polling = true;
  const tick = async () => {
    if(!sessionUser){ checkout.polling = false; return; }
    try{
      const data = await apiFetch("/api/billing/status");
      account = data.account || account;
      if(hasActivePlan()){
        checkout.polling = false;
        checkout.url = "";
        billingTimer = null;
        go("wizard");
        return;
      }
    }catch(e){ /* segue tentando: o webhook também libera o acesso */ }
    billingTimer = window.setTimeout(tick, 6000);
  };
  billingTimer = window.setTimeout(tick, 5000);
}

function stopBillingPolling(){
  if(billingTimer) window.clearTimeout(billingTimer);
  billingTimer = null;
  checkout.polling = false;
}

/* ---------- navegação com o botão "voltar" nativo ---------- */
const AUTH_SCREENS = ["wizard", "summary", "results", "history", "marks", "plans", "checkout", "admin"];

function routeSnapshot(){
  return {
    screen: state.screen,
    stepIndex: state.stepIndex,
    historyIndex: state.historyIndex,
    pipoca: true
  };
}

function pushRoute(replace){
  try{
    window.history[replace ? "replaceState" : "pushState"](routeSnapshot(), "", window.location.href);
  }catch(e){ /* navegadores sem History API seguem funcionando sem o voltar */ }
}

/* Toda navegação da plataforma passa por aqui: assim o botão voltar do
   celular anda pelas telas em vez de sair do site. */
function go(screen, mutate){
  if(typeof mutate === "function") mutate();
  state.screen = screen;
  render();
  pushRoute(false);
}

function applyRoute(snapshot){
  wizardNotice = "";
  const target = snapshot && snapshot.screen ? snapshot.screen : (sessionUser ? "wizard" : "landing");
  state.stepIndex = snapshot && typeof snapshot.stepIndex === "number" ? snapshot.stepIndex : 0;
  state.historyIndex = snapshot && typeof snapshot.historyIndex === "number" ? snapshot.historyIndex : -1;
  state.viewingHistoryItem = state.historyIndex >= 0 && state.historyList ? state.historyList[state.historyIndex] : null;
  let screen = target;
  if(!sessionUser && AUTH_SCREENS.indexOf(screen) !== -1) screen = "landing";
  if(sessionUser && !hasActivePlan() && ["wizard", "summary", "results"].indexOf(screen) !== -1) screen = "plans";
  if(screen === "loading") screen = "summary";
  state.screen = screen;
  render();
}

window.addEventListener("popstate", event => {
  applyRoute(event.state);
});

    else fetch("/api/auth/logout", { method: "POST", credentials: "same-origin", keepalive: true });
  }catch(e){}
});

    state.screen = "admin";
    if(shouldRender) render();

  }
  await Promise.all([loadAccount(), loadMarks(), loadPlans()]);

    checkout.plan = account.plan || "";

    state.screen = "checkout";

function setPendingAccess(data){
  pendingAccess = { email: data.email, token: data.token };
  accessStatus = data.status || "pending";
  try{ window.localStorage.setItem("pipoca_pending_access", JSON.stringify(pendingAccess)); }catch(e){}
}

function clearPendingAccess(){
  pendingAccess = null;
  accessStatus = null;
  try{ window.localStorage.removeItem("pipoca_pending_access"); }catch(e){}
  if(pendingStatusTimer){ clearTimeout(pendingStatusTimer); pendingStatusTimer = null; }
}

async function checkPendingAccess(shouldRender = true){
  if(!pendingAccess || !pendingAccess.email || !pendingAccess.token) return;
  try{
    const query = "?email=" + encodeURIComponent(pendingAccess.email) + "&token=" + encodeURIComponent(pendingAccess.token);
    const response = await fetch("/api/auth/status" + query, { credentials: "same-origin", cache: "no-store" });
    const data = await response.json().catch(() => ({}));
    if(response.ok && data.status){
      accessStatus = data.status;
      if(accessStatus !== "pending") pendingStatusTimer = null;
      if(shouldRender && state.screen === "access-status") render();
      if(accessStatus === "pending" && state.screen === "access-status") pendingStatusTimer = setTimeout(() => checkPendingAccess(true), 15000);
      return;
    }
  }catch(e){}
  if(accessStatus === "pending" && state.screen === "access-status") pendingStatusTimer = setTimeout(() => checkPendingAccess(true), 15000);
}

/* =========================================================
   PIPOCA DE FUNDO — enche a tela conforme o progresso
   ========================================================= */
function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

const rng = seededRandom(1337);
const POPCORN_COUNT = 170;
const POPCORN_KERNELS = [];
for(let i = 0; i < POPCORN_COUNT; i++){
  const r1 = rng(), r2 = rng(), r3 = rng(), r4 = rng(), r5 = rng();
  // tiers: pequenas ao fundo (mais comuns), médias flutuando, grandes em foco (mais raras)
  let tier, size;
  if(r5 < 0.40){ tier = "small";  size = 9 + r3 * 6;  }
  else if(r5 < 0.85){ tier = "medium"; size = 17 + r3 * 9; }
  else { tier = "large"; size = 27 + r3 * 9; }

  POPCORN_KERNELS.push({
    x: r1 * 100,
    y: Math.pow(r2, 1.35) * 100, // mais denso perto do topo, rareando conforme desce
    size: size,
    rot: r4 * 360,
    tier: tier
  });
}

const kernelEls = new Map(); // idx -> elemento no DOM

function popcornLevel(){
  // fração de 0 a 1 de quanto a tela deve estar "cheia" de pipoca, de cima para baixo
  if(state.screen === "wizard"){
    return state.stepIndex / STEPS.length;
  }
  // summary, loading, results, history, error: já respondeu tudo
  return 1;
}

function buildKernelEl(k){
  const el = document.createElement("div");
  el.className = "kernel tier-" + k.tier;
  el.style.left = k.x.toFixed(2) + "%";
  el.style.top = k.y.toFixed(2) + "%";
  el.style.width = k.size.toFixed(1) + "px";
  el.style.height = (k.size * 0.86).toFixed(1) + "px";
  el.style.setProperty("--rot", k.rot.toFixed(1) + "deg");

  const p1 = document.createElement("span");
  p1.className = "petal p1";
  const p2 = document.createElement("span");
  p2.className = "petal p2";
  const p3 = document.createElement("span");
  p3.className = "petal p3";
  const core = document.createElement("span");
  core.className = "core";

  el.appendChild(p1);
  el.appendChild(p2);
  el.appendChild(p3);
  el.appendChild(core);
  return el;
}

function syncPopcorn(){
  const container = document.getElementById("popcorn-bg");
  if(!container) return;
  const thresholdY = popcornLevel() * 100;

  POPCORN_KERNELS.forEach((k, idx) => {
    const shouldShow = k.y <= thresholdY;
    const exists = kernelEls.has(idx);

    if(shouldShow && !exists){
      const el = buildKernelEl(k);
      container.appendChild(el);
      kernelEls.set(idx, el);
    } else if(!shouldShow && exists){
      kernelEls.get(idx).remove();
      kernelEls.delete(idx);
    }
  });
}

async function getRecommendations(filters){
  const data = await apiFetch(RECOMMENDATION_ENDPOINT, {
    method: "POST",

  });
  if(data.account) account = data.account;
  const text = data.text || "";
  const clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
  let parsed;
  try{
    parsed = JSON.parse(clean);
  }catch(e){
    throw new Error("Não consegui interpretar a resposta do motor de recomendação. Tente novamente.");
  }
  if(!parsed.recommendations || !Array.isArray(parsed.recommendations) || parsed.recommendations.length === 0){
    throw new Error("O motor de recomendação não retornou resultados válidos.");
  }
  return parsed;
}

/* =========================================================
   PÔSTERES REAIS — via Wikipedia REST API (sem chave)
   O modelo não consegue prever URLs de imagem válidas,
   então buscamos a imagem real do filme depois de ter o título.
   ========================================================= */
function upscaleWikiThumb(src){
  // ".../thumb/x/xx/Nome.jpg/220px-Nome.jpg" -> pede uma versão maior
  return src.replace(/\/\d+px-/, "/500px-");
}

async function wikiSummaryThumb(title, lang){
  try{
    const endpoint = "https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title);
    const res = await fetch(endpoint, { headers: { "accept": "application/json" } });
    if(!res.ok) return null;
    const data = await res.json();
    if(data.type === "disambiguation") return null;
    if(data.thumbnail && data.thumbnail.source){
      return upscaleWikiThumb(data.thumbnail.source);
    }
    return null;
  }catch(e){
    return null;
  }
}

async function fetchPosterUrl(rec){
  const original = (rec.title_original || rec.title_pt || "").trim();
  const pt = (rec.title_pt || rec.title_original || "").trim();
  const year = rec.year;
  if(!original && !pt) return "";

  const isSeries = String(rec.content_type || "filme").toLowerCase().indexOf("seri") === 0;
  const candidates = [];
  if(original){
    if(isSeries){
      candidates.push(original + " (TV series)");
      if(year) candidates.push(original + " (" + year + " TV series)");
    }else{
      if(year) candidates.push(original + " (" + year + " film)");
      candidates.push(original + " (film)");
    }
    candidates.push(original);
  }
  if(pt && pt !== original){
    candidates.push(pt);
  }

  for(const lang of ["en","pt"]){
    for(const c of candidates){
      const url = await wikiSummaryThumb(c, lang);
      if(url) return url;
    }
  }
  return "";
}

/* ---------- storage helpers ---------- */
function browserStorage(){
  if(window.storage && typeof window.storage.set === "function" && typeof window.storage.list === "function"){
    return {
      async set(key, value){ await window.storage.set(key, value, false); },
      async list(prefix){ return await window.storage.list(prefix, false); },
      async get(key){ return await window.storage.get(key, false); }
    };
  }
  return {
    async set(key, value){ window.localStorage.setItem(key, value); },
    async list(prefix){ return { keys: Object.keys(window.localStorage).filter(key => key.startsWith(prefix)) }; },
    async get(key){ return { value: window.localStorage.getItem(key) }; }
  };
}

async function saveToHistory(record){
  try{
    const key = "search:" + record.created_at;
    await browserStorage().set(key, JSON.stringify(record));
  }catch(e){ /* best-effort, non-blocking */ }
}

async function loadHistory(){
  try{
    const storage = browserStorage();
    const listing = await storage.list("search:");
    const keys = (listing && listing.keys) ? listing.keys.slice().sort().reverse() : [];
    const items = [];
    for(const k of keys){
      try{
        const r = await storage.get(k);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){}
    }
    return items;
  }catch(e){
    return [];
  }
}

   backend. Uma nota 0 (ou ausente) significa "o motor não sabe" e não vira
   pílula na tela. */

function formatRating(value, decimals){
  const number = Number(value);
  if(!isFinite(number) || number <= 0) return "";
  return decimals ? number.toFixed(decimals).replace(".", ",") : String(Math.round(number));
}

const EYE_OFF_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 6.1A9.9 9.9 0 0 1 12 6c6.4 0 10 6 10 6a17.8 17.8 0 0 1-3.4 4M6.3 7.8A17.4 17.4 0 0 0 2 12s3.6 6 10 6a10 10 0 0 0 4.3-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>';

/* Campo de formulário. Campos de senha ganham o ícone de olho para o cliente
   conferir o que digitou antes de enviar. */
function buildField(labelText, type, name, placeholder, autocomplete, options){
  const settings = options || {};
  const field = document.createElement("div");
  field.className = "field";
  const label = document.createElement("label");
  label.textContent = labelText;
  const input = document.createElement("input");
  input.type = type;
  input.name = name;
  input.autocomplete = autocomplete || "off";
  input.placeholder = placeholder || "";
  input.required = settings.required !== false;
  if(settings.inputmode) input.inputMode = settings.inputmode;
  if(settings.maxlength) input.maxLength = settings.maxlength;
  if(settings.value) input.value = settings.value;
  field.appendChild(label);

  if(type === "password"){
    const wrap = document.createElement("div");
    wrap.className = "input-wrap";
    const peek = document.createElement("button");
    peek.type = "button";
    peek.className = "peek";
    peek.innerHTML = EYE_OPEN_SVG;
    peek.setAttribute("aria-label", "Mostrar a senha");
    peek.title = "Mostrar a senha";
    peek.onclick = () => {
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      peek.innerHTML = showing ? EYE_OPEN_SVG : EYE_OFF_SVG;
      const message = showing ? "Mostrar a senha" : "Ocultar a senha";
      peek.setAttribute("aria-label", message);
      peek.title = message;
      input.focus();
    };
    wrap.appendChild(input);
    wrap.appendChild(peek);
    field.appendChild(wrap);
  }else{
    field.appendChild(input);
  }
  return { field, input };
}

function renderLogin(){
  const wrap = document.createElement("section");
  wrap.className = "auth-card";
  const kicker = document.createElement("div");
  kicker.className = "landing-kicker";
  kicker.textContent = authMode === "login" ? "Acesso à sua sessão" : "Primeiro passo para entrar";
  const title = document.createElement("h2");
  title.textContent = authMode === "login" ? "Entrar no Pipoca & Play" : "Criar meu acesso";
  const copy = document.createElement("p");
  copy.textContent = authMode === "login"
    ? "Use seu e-mail e sua senha para continuar. O administrador valida cada novo acesso antes da primeira entrada."
    : "Cadastre seu e-mail e uma senha individual. Depois, o administrador analisa o pedido antes de liberar a plataforma.";
  wrap.appendChild(kicker);
  wrap.appendChild(title);
  wrap.appendChild(copy);

  const tabs = document.createElement("div");
  tabs.className = "auth-tabs";
  [["login", "Já tenho acesso"], ["register", "Quero me cadastrar"]].forEach(([mode, label]) => {
    const tab = document.createElement("button");
    tab.type = "button";
    tab.className = "auth-tab" + (authMode === mode ? " active" : "");
    tab.textContent = label;
    tab.onclick = () => { authMode = mode; authError = ""; render(); };
    tabs.appendChild(tab);
  });
  wrap.appendChild(tabs);

  if(authError){
    const error = document.createElement("div");
    error.className = "auth-error";
    error.textContent = authError;
    wrap.appendChild(error);
  }

  const makeField = buildField;

  const form = document.createElement("form");
  const email = makeField("E-mail", "email", "email", "voce@exemplo.com", "email");
  const password = makeField("Senha", "password", "password", authMode === "login" ? "Sua senha" : "Mínimo de 8 caracteres", authMode === "login" ? "current-password" : "new-password");
  form.appendChild(email.field);
  form.appendChild(password.field);
  let confirmation = null;
  if(authMode === "register"){
    confirmation = makeField("Confirmar senha", "password", "confirmation", "Repita sua senha", "new-password");
    form.appendChild(confirmation.field);
  }
  const submit = document.createElement("button");
  submit.className = "cta";
  submit.type = "submit";
  submit.textContent = authMode === "login" ? "Continuar" : "Enviar cadastro";
  form.appendChild(submit);
  form.onsubmit = event => {
    event.preventDefault();
    submit.disabled = true;
    if(authMode === "login") login(email.input.value, password.input.value);
    else register(email.input.value, password.input.value, confirmation.input.value);
  };
  wrap.appendChild(form);

  const note = document.createElement("p");
  note.className = "auth-footnote";
  note.textContent = authMode === "login"
    ? "A sessão é protegida por cookie HttpOnly e expira automaticamente."
    : "A senha é armazenada apenas como hash seguro e nunca fica visível para o administrador.";
  wrap.appendChild(note);
  const back = document.createElement("button");
  back.className = "back-link";
  back.textContent = "← Voltar para a apresentação";
  back.onclick = () => { authError = ""; go("landing"); };
  wrap.appendChild(back);
  return wrap;
}

function renderAccessStatus(){
  const wrap = document.createElement("section");
  wrap.className = "status-panel";
  const status = accessStatus || "pending";
  const icon = document.createElement("div");
  icon.className = "status-icon";
  icon.textContent = status === "approved" ? "LIBERADO" : status === "rejected" ? "REVISAR" : "EM ANÁLISE";
  const title = document.createElement("h2");
  title.textContent = status === "approved" ? "Seu acesso foi validado" : status === "rejected" ? "Pedido não aprovado" : "Cadastro recebido";
  const copy = document.createElement("p");
  copy.textContent = status === "approved"
    ? "O administrador autorizou seu cadastro. Agora você já pode entrar na plataforma com o e-mail e a senha cadastrados."
    : status === "rejected"
      ? "O administrador rejeitou este pedido. Se desejar, você pode enviar um novo cadastro para análise."
      : "O seu acesso será liberado assim que o administrador validar. Por favor, aguarde a liberação. Esta tela será atualizada automaticamente.";
  const email = document.createElement("div");
  email.className = "status-email";
  email.textContent = pendingAccess && pendingAccess.email ? pendingAccess.email : "";
  wrap.appendChild(icon);
  wrap.appendChild(title);
  wrap.appendChild(copy);
  wrap.appendChild(email);

  const actions = document.createElement("div");
  actions.className = "status-actions";
  if(status === "pending"){
    const refresh = document.createElement("button");
    refresh.className = "cta small";
    refresh.textContent = "Verificar agora";
    refresh.onclick = () => checkPendingAccess(true);
    actions.appendChild(refresh);
  }else if(status === "approved"){
    const enter = document.createElement("button");
    enter.className = "cta small";
    enter.textContent = "Entrar na plataforma";
    enter.onclick = () => { clearPendingAccess(); authMode = "login"; go("login"); };
    actions.appendChild(enter);
  }else{
    const retry = document.createElement("button");
    retry.className = "cta small";
    retry.textContent = "Fazer novo cadastro";
    retry.onclick = () => { clearPendingAccess(); authMode = "register"; authError = ""; go("login"); };
    actions.appendChild(retry);
  }
  const back = document.createElement("button");
  back.className = "cta secondary small";
  back.textContent = "Voltar para a apresentação";
  back.onclick = () => go("landing");
  actions.appendChild(back);
  wrap.appendChild(actions);
  return wrap;
}

function formatUserDate(value){
  if(!value) return "";
  try{ return new Date(value).toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }); }
  catch(e){ return value; }
}

function renderUserCard(user){
  const card = document.createElement("div");
  card.className = "user-card" + (user.status === "pending" ? " pending" : "");
  const top = document.createElement("div");
  top.className = "user-card-top";
  const identity = document.createElement("div");
  const email = document.createElement("div");
  email.className = "user-email";
  email.textContent = user.email;
  identity.appendChild(email);
  const date = document.createElement("div");
  date.className = "user-date";
  date.textContent = "Pedido em " + formatUserDate(user.created_at);
  identity.appendChild(date);
  const badge = document.createElement("span");
  badge.className = "user-status " + user.status;
  badge.textContent = user.status === "pending" ? "Aguardando" : user.status === "approved" ? "Aprovado" : "Rejeitado";
  top.appendChild(identity);
  top.appendChild(badge);
  card.appendChild(top);

  const actions = document.createElement("div");
  actions.className = "user-actions";
  if(user.status !== "approved"){
    const approve = document.createElement("button");
    approve.className = "admin-action approve";
    approve.textContent = "Aceitar acesso";
    approve.onclick = () => adminAction(user.id, "approve");
    actions.appendChild(approve);
  }
  if(user.status !== "rejected"){
    const reject = document.createElement("button");
    reject.className = "admin-action reject";
    reject.textContent = "Rejeitar";
    reject.onclick = () => adminAction(user.id, "reject");
    actions.appendChild(reject);
  }
  const remove = document.createElement("button");
  remove.className = "admin-action delete";
  remove.textContent = "Excluir usuário";
  remove.onclick = () => adminAction(user.id, "delete");
  actions.appendChild(remove);
  card.appendChild(actions);
  return card;
}

  title.textContent = hasActivePlan() ? "Seu plano no Pipoca & Play" : "Assine para liberar as indicações";
  wrap.appendChild(title);

  const copy = document.createElement("p");
  copy.className = "plans-copy";
  copy.textContent = hasActivePlan()
    ? "Cada consulta de filme, série ou novela consome 1 crédito. Os créditos diários voltam todo dia à meia-noite."
    : "1 crédito = 1 consulta de filme, série ou novela. O acesso é liberado assim que a Asaas confirmar o pagamento.";

    const box = document.createElement("div");

    const expires = account.expires_at ? new Date(account.expires_at).toLocaleDateString("pt-BR") : "";

      (account.unlimited ? "Consultas ilimitadas" : "Créditos de hoje: " + account.credits_remaining + " de " + account.daily_credits) +

    const box = document.createElement("div");
    box.className = "auth-error";
    box.textContent = "A última cobrança não foi confirmada pela Asaas. Refaça o pagamento para voltar a receber indicações.";
    wrap.appendChild(box);

/* Uma resposta sempre é lida como lista: as perguntas de marcação única têm
   um item só. Nada de split por vírgula aqui — opções como "Aclamados pela
   Crítica / Premiações (Oscar, Cannes)" já trazem vírgula no próprio nome. */
function filterAnswers(key){
  const raw = state.filters[key];
  if(Array.isArray(raw)) return raw.slice();
  return raw ? [raw] : [];
}

function answerLabel(key){
  return filterAnswers(key).join(", ");
}

function isAnswerSelected(step, option){
  return filterAnswers(step.key).indexOf(option) !== -1;
}

/* Devolve a nova marcação da pergunta múltipla, ou null quando o teto foi
   atingido — aí a tela avisa em vez de trocar a seleção por baixo do usuário. */
function toggleAnswer(step, option){
  if(option === ANY_PLATFORM) return [ANY_PLATFORM];
  const next = filterAnswers(step.key).filter(item => item !== ANY_PLATFORM);
  const at = next.indexOf(option);
  if(at !== -1){
    next.splice(at, 1);
    return next;
  }
  if(next.length >= MAX_PLATFORMS_PER_SEARCH) return null;
  next.push(option);
  return next;
}

function advanceStep(){
  wizardNotice = "";
  if(state.stepIndex < STEPS.length - 1){
    go("wizard", () => { state.stepIndex += 1; });
  }else{
    go("summary");
  }
}

function renderWizard(){
  const wrap = document.createElement("div");
  wrap.appendChild(renderPerf());

  const step = STEPS[state.stepIndex];
  const chosen = filterAnswers(step.key);

  const eyebrow = document.createElement("div");
  eyebrow.className = "step-eyebrow";
  eyebrow.textContent = step.eyebrow;

  const q = document.createElement("h2");
  q.className = "step-question";
  q.textContent = step.question;

  wrap.appendChild(eyebrow);
  wrap.appendChild(q);

  if(step.hint){
    const hint = document.createElement("p");
    hint.className = "step-hint";
    hint.textContent = step.hint;
    wrap.appendChild(hint);
  }

  const opts = document.createElement("div");
  opts.className = "options";

  step.options.forEach(opt => {
    const selected = isAnswerSelected(step, opt);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (step.multi ? " multi" : "") + (selected ? " selected" : "");

    if(step.logos) b.appendChild(platformLogo(opt));

    const label = document.createElement("span");
    label.className = "opt-label";
    label.textContent = opt;
    b.appendChild(label);

    if(step.multi){
      b.setAttribute("aria-pressed", selected ? "true" : "false");
      const check = document.createElement("span");
      check.className = "opt-check";
      check.textContent = selected ? "✔" : "";
      b.appendChild(check);
      b.onclick = () => {
        const next = toggleAnswer(step, opt);
        if(next === null){
          wizardNotice = "Você já marcou " + MAX_PLATFORMS_PER_SEARCH +
            " serviços. Desmarque um para escolher outro.";
        }else{
          wizardNotice = "";
          state.filters[step.key] = next;
        }
        render();
      };
    }else{
      b.onclick = () => {
        state.filters[step.key] = opt;
        advanceStep();
      };
    }
    opts.appendChild(b);
  });

  wrap.appendChild(opts);

  if(step.multi){
    if(wizardNotice){
      const notice = document.createElement("p");
      notice.className = "step-notice";
      notice.textContent = wizardNotice;
      wrap.appendChild(notice);
    }
    const cta = document.createElement("button");
    cta.type = "button";
    cta.className = "cta small multi-continue";
    cta.disabled = chosen.length === 0;
    cta.textContent = chosen.length > 1
      ? "Continuar com " + chosen.length + " serviços"
      : "Continuar";
    cta.onclick = () => { if(chosen.length) advanceStep(); };
    wrap.appendChild(cta);
  }

  if(state.stepIndex > 0){
    const back = document.createElement("button");
    back.className = "back-link";
    back.textContent = "← Voltar";
    back.onclick = () => window.history.back();
    wrap.appendChild(back);
  }

  return wrap;
}

async function runSearch(){
  if(sessionUser && sessionUser.role !== "admin" && !hasActivePlan()){
    await loadPlans();
    go("plans");
    return;
  }
  state.screen = "loading";
  render();
  try{
    const result = await getRecommendations(state.filters);

    // busca os pôsteres reais antes de mostrar os cards
    await Promise.all(result.recommendations.map(async rec => {
      if(rec.poster_url) return;
      try{
        const poster = await fetchPosterUrl(rec);
        rec.poster_url = poster || "";
      }catch(e){
        rec.poster_url = "";
      }
    }));

    state.interpretation = result.interpretation || "";
    state.bestChoice = result.best_choice || null;
    state.recommendations = result.recommendations;
    go("results");

    const record = {
      filters: { ...state.filters },
      interpretation: state.interpretation,
      bestChoice: state.bestChoice,
      recommendations: state.recommendations,
      prompt_version: PROMPT_VERSION,
      created_at: new Date().toISOString()
    };
    saveToHistory(record);
  }catch(e){
    if(e.code === "subscription_required"){
      if(Array.isArray(e.payload && e.payload.plans)) plansCatalog = e.payload.plans;
      await loadAccount();
      checkout.error = e.message;
      go("plans");
      return;
    }
    if(e.code === "no_credits"){
      if(e.payload && e.payload.account) account = e.payload.account;
      state.errorMsg = e.message;
      go("error");
      return;
    }
    if(e.status === 401){
      sessionUser = null;
      account = null;
      authError = "Sua sessão expirou. Entre novamente para continuar.";
      go("login");
      return;
    }
    state.errorMsg = e.message || "Não consegui buscar recomendações agora.";
    go("error");
  }
}

function renderTicket(rec){
  const t = document.createElement("div");
  t.className = "ticket";

  /* --- banner / poster --- */
  const banner = document.createElement("div");
  banner.className = "ticket-banner";
  const fallback = document.createElement("div");
  fallback.className = "fallback";
  fallback.innerHTML = '<span class="ico">🎞️</span><span class="txt">pôster não disponível</span>';
  banner.appendChild(fallback);

  if(rec.backdrop_url || rec.poster_url){
    const img = document.createElement("img");
    img.src = rec.backdrop_url || rec.poster_url;
    img.alt = rec.title_pt || rec.title_original || "pôster do filme";
    img.loading = "lazy";
    img.onload = () => {
      img.classList.add("loaded");
      fallback.style.display = "none";
    };
    img.onerror = () => { img.remove(); };
    banner.appendChild(img);
  }

  const head = document.createElement("div");
  head.className = "ticket-head";

  const rankRow = document.createElement("div");
  rankRow.className = "rank-row";

  const badgesLeft = document.createElement("div");
  badgesLeft.className = "badges-left";
  const badge = document.createElement("span");
  badge.className = "rank-badge";
  badge.textContent = "ESCOLHA #" + rec.rank;
  badgesLeft.appendChild(badge);
  const isSeries = String(rec.content_type || "filme").toLowerCase().indexOf("seri") === 0;
  const kind = document.createElement("span");
  kind.className = "kind-badge" + (isSeries ? " serie" : "");
  kind.textContent = isSeries ? "SÉRIE" : "FILME";
  badgesLeft.appendChild(kind);
  if(rec.age_rating_br){
    const age = document.createElement("span");
    age.className = "age-badge";
    age.textContent = rec.age_rating_br + " anos";
    badgesLeft.appendChild(age);
  }

  const stamp = document.createElement("span");
  stamp.className = "match-stamp";
  stamp.textContent = (rec.match_score || "—") + "% MATCH";

  rankRow.appendChild(badgesLeft);
  rankRow.appendChild(stamp);

  const h3 = document.createElement("h3");
  h3.textContent = rec.title_pt || rec.title_original;

  head.appendChild(rankRow);
  head.appendChild(h3);

  if(rec.title_pt && rec.title_original && rec.title_pt !== rec.title_original){
    const orig = document.createElement("div");
    orig.className = "orig-title";
    orig.textContent = "Título original: " + rec.title_original;
    head.appendChild(orig);
  }

  const meta = document.createElement("div");
  meta.className = "meta-row";
  const parts = [];
  if(rec.year) parts.push(String(rec.year));
  if(isSeries && rec.seasons) parts.push(rec.seasons + (rec.seasons > 1 ? " temporadas" : " temporada"));
  if(rec.runtime_minutes) parts.push(rec.runtime_minutes + " min" + (isSeries ? "/ep" : ""));
  if(rec.genres && rec.genres.length) parts.push(rec.genres.join(" · "));
  parts.forEach(p => {
    const span = document.createElement("span");
    span.textContent = p;
    meta.appendChild(span);
  });
  head.appendChild(meta);

  if(rec.vibe_tags && rec.vibe_tags.length){
    const vibeRow = document.createElement("div");
    vibeRow.className = "vibe-row";
    rec.vibe_tags.forEach(v => {
      const chip = document.createElement("span");
      chip.className = "vibe-chip";
      chip.textContent = v;
      vibeRow.appendChild(chip);
    });
    head.appendChild(vibeRow);
  }

  const tear = document.createElement("div");
  tear.className = "tear-line";

  const body = document.createElement("div");
  body.className = "ticket-body";

  const l1 = document.createElement("div");
  l1.className = "label";
  l1.textContent = "SINOPSE";
  const p1 = document.createElement("p");
  p1.textContent = rec.synopsis || "";

  const l2 = document.createElement("div");
  l2.className = "label";
  l2.textContent = "POR QUE COMBINA";
  const p2 = document.createElement("p");
  p2.textContent = rec.why_it_matches || "";

  body.appendChild(l1);
  body.appendChild(p1);
  body.appendChild(l2);
  body.appendChild(p2);

  /* ratings */
  const ratings = rec.ratings || {};
  const scored = RATING_SOURCES
    .map(source => ({ source: source, text: formatRating(ratings[source.key], source.decimals) }))
    .filter(entry => entry.text);
  if(scored.length){
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "AVALIAÇÕES";
    body.appendChild(label);

    const ratingsRow = document.createElement("div");
    ratingsRow.className = "ratings-row";
    scored.forEach(entry => {
      const pill = document.createElement("span");
      pill.className = "rating-pill";
      pill.title = "Avaliação no " + entry.source.label + " (" + entry.source.scale + ")";

      const name = document.createElement("span");
      name.className = "rating-name";
      name.textContent = entry.source.icon + " " + entry.source.label;

      const value = document.createElement("span");
      value.className = "rating-value";
      value.textContent = entry.text + entry.source.suffix;

      pill.appendChild(name);
      pill.appendChild(value);
      ratingsRow.appendChild(pill);
    });
    body.appendChild(ratingsRow);
  }

  /* awards */
  if(rec.awards && (rec.awards.oscars_won || rec.awards.highlight)){
    const awardsRow = document.createElement("div");
    awardsRow.className = "awards-row";
    let txt = "🏆 ";
    if(rec.awards.oscars_won) txt += rec.awards.oscars_won + "x Oscar";
    if(rec.awards.highlight) txt += (rec.awards.oscars_won ? " · " : "") + rec.awards.highlight;
    awardsRow.textContent = txt;
    body.appendChild(awardsRow);
  }

  /* where to watch */
      if(rec.where_to_watch && rec.where_to_watch.length){

    const wl = document.createElement("div");
    wl.className = "label";
    wl.textContent = "ONDE ASSISTIR";
    body.appendChild(wl);
    const chips = document.createElement("div");
    chips.className = "watch-chips";
    rec.where_to_watch.slice(0,4).forEach(w => {
      if(!w.platform) return;
      const chip = document.createElement("span");
      chip.className = "watch-chip";
      const icon = WATCH_TYPE_ICON[w.type] || "🎬";
      const label = WATCH_TYPE_LABEL[w.type] || "";
      chip.textContent = icon + " " + w.platform + (label ? " · " + label : "");
      chips.appendChild(chip);
    });
    body.appendChild(chips);
  }else{
    const unavailable = document.createElement("p");
    unavailable.className = "disclaimer";
    unavailable.style.textAlign = "left";
    unavailable.textContent = rec.availability_note || "Disponibilidade não confirmada no momento.";
    body.appendChild(unavailable);
  }

  /* marcações do usuário: alimentam o prompt das próximas indicações */
  if(sessionUser && sessionUser.role !== "admin"){
    const mark = markFor(rec) || { opinion: "", watched: false };
    const markRow = document.createElement("div");
    markRow.className = "mark-row";
    const buttons = [];
    [
      ["liked", "like", "👍 Gostei", mark.opinion === "liked"],
      ["disliked", "dislike", "👎 Não gostei", mark.opinion === "disliked"],
      ["watched", "watched", "✔ Já assisti", !!mark.watched]
    ].forEach(([kind, variant, label, isOn]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "mark-btn " + variant + (isOn ? " on" : "");
      button.textContent = label;
      button.setAttribute("aria-pressed", isOn ? "true" : "false");
      button.onclick = () => toggleMark(rec, kind, buttons);
      buttons.push(button);
      markRow.appendChild(button);
    });
    body.appendChild(markRow);

    const markHint = document.createElement("div");
    markHint.className = "mark-hint";
    markHint.textContent = "Suas marcações entram no próximo pedido: já assisti sai das indicações, gostei e não gostei ajustam o estilo.";
    body.appendChild(markHint);
  }

  /* verification links */
  const linksLabel = document.createElement("div");
  linksLabel.className = "label";
  linksLabel.textContent = "CONFERIR NA FONTE";
  body.appendChild(linksLabel);

  const links = document.createElement("div");
  links.className = "links-row";
  const titleForLinks = rec.title_original || rec.title_pt;
  [
    ["JustWatch", justWatchUrl(titleForLinks)],
    ["IMDb", imdbUrl(titleForLinks)],
    ["Rotten Tomatoes", rottenTomatoesUrl(titleForLinks)],
    ["Metacritic", metacriticUrl(titleForLinks)],
    ["Google", googleUrl(titleForLinks, isSeries)],
    ["Letterboxd", letterboxdUrl(titleForLinks)],
    ["AdoroCinema", adoroCinemaUrl(titleForLinks)],
    ["Mercado Livre", mercadoLivreUrl(titleForLinks)]
  ].forEach(([label, url]) => {
    const a = document.createElement("a");
    a.className = "link-chip";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = label + " ↗";
    links.appendChild(a);
  });
  body.appendChild(links);

  t.appendChild(banner);
  t.appendChild(head);
  t.appendChild(tear);
  t.appendChild(body);
  return t;
}

function renderHistory(){
  const wrap = document.createElement("div");
  const h = document.createElement("div");
  h.className = "results-header";
  h.textContent = "Histórico de buscas";
  wrap.appendChild(h);

  if(state.viewingHistoryItem){
    const item = state.viewingHistoryItem;
    const back = document.createElement("button");
    back.className = "back-link";
    back.textContent = "← Todas as buscas";
    back.style.display = "block";
    back.style.marginBottom = "14px";
    back.onclick = () => window.history.back();
    wrap.appendChild(back);

    if(item.interpretation){
      const box = document.createElement("div");
      box.className = "interp-box";
      box.textContent = item.interpretation;
      wrap.appendChild(box);
    }
    if(item.bestChoice && item.bestChoice.title_pt){
      const hero = document.createElement("div");
      hero.className = "hero-pick";
      hero.innerHTML = '<div class="hp-eyebrow">🍿 Melhor pedida de hoje</div><div class="hp-title">' +
        escapeHtml(item.bestChoice.title_pt) + '</div><p class="hp-reason">' +
        escapeHtml(item.bestChoice.reason || "") + '</p>';
      wrap.appendChild(hero);
    }
    const hint = document.createElement("p");
    hint.className = "scroll-hint";
    hint.textContent = "◀ arraste para o lado para ver as 3 opções ▶";
    wrap.appendChild(hint);

    const scrollRow = document.createElement("div");
    scrollRow.className = "tickets-scroll";
    item.recommendations
      .slice()
      .sort((a,b) => (b.match_score||0) - (a.match_score||0))
      .forEach(rec => scrollRow.appendChild(renderTicket(rec)));
    wrap.appendChild(scrollRow);
    return wrap;
  }

  if(!state.historyList || state.historyList.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Nenhuma busca ainda. Suas próximas recomendações vão aparecer aqui.";
    wrap.appendChild(empty);
    return wrap;
  }

  state.historyList.forEach((item, index) => {
    const el = document.createElement("div");
    el.className = "hist-item";
    const hd = document.createElement("div");
    hd.className = "hd";
    const date = new Date(item.created_at);
    hd.textContent = date.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric" }) +
      " · " + date.toLocaleTimeString("pt-BR", { hour:"2-digit", minute:"2-digit" });
    const ht = document.createElement("div");
    ht.className = "ht";
    ht.textContent = [item.filters.content_type, item.filters.genre, item.filters.mood].filter(Boolean).join(" · ");
    el.appendChild(hd);
    el.appendChild(ht);
    el.onclick = () => go("history", () => { state.viewingHistoryItem = item; state.historyIndex = index; });
    wrap.appendChild(el);
  });

  return wrap;
}

function escapeHtml(str){
  if(str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

render();
bootstrapAuth();
</script>
</body>
</html>
