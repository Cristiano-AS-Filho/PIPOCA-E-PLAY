<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipoca & Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1218;
    --bg-elev:#171B24;
    --bg-elev-2:#1E2330;
    --marquee:#F2A93B;
    --marquee-dim:#8A6A2E;
    --velvet:#8A2A4C;
    --cream:#EFE6D8;
    --cream-dim:#C9BFAF;
    --teal:#3C8C7A;
    --ink:#181310;
    --danger:#C4553D;
    --gold:#C9992E;
    --radius:10px;
    --max:460px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- ambient popcorn background ---------- */
  #popcorn-bg{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    background:var(--bg);
    /* Toda palavra deste app vive dentro da coluna central (--max).
       Por isso a pipoca perto/atrás do texto cai para ~10% de opacidade,
       preservando contraste e leitura em qualquer ponto de rolagem. */
    mask-image: linear-gradient(90deg,
      black 0,
      black calc(50% - 270px),
      rgba(0,0,0,0.1) calc(50% - 230px),
      rgba(0,0,0,0.1) calc(50% + 230px),
      black calc(50% + 270px),
      black 100%
    );
    -webkit-mask-image: linear-gradient(90deg,
      black 0,
      black calc(50% - 270px),
      rgba(0,0,0,0.1) calc(50% - 230px),
      rgba(0,0,0,0.1) calc(50% + 230px),
      black calc(50% + 270px),
      black 100%
    );
    mask-repeat:no-repeat;
    -webkit-mask-repeat:no-repeat;
  }
  #popcorn-bg::after{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(242,169,59,0.10), transparent 55%),
      linear-gradient(180deg, rgba(15,18,24,0.30) 0%, rgba(15,18,24,0.66) 55%, rgba(15,18,24,0.90) 100%);
    pointer-events:none;
  }

  /* ---------- realistic popcorn kernel (butterfly-type, multi-lobe) ---------- */
  .kernel{
    position:absolute;
    transform:translateY(-46px) rotate(var(--rot,0deg)) scale(0.6);
    opacity:0;
    animation:fallIn .6s cubic-bezier(.22,.9,.4,1.15) both;
  }
  .kernel.tier-large{ z-index:3; filter:drop-shadow(0 3px 3px rgba(0,0,0,0.28)); }
  .kernel.tier-medium{ z-index:2; opacity:0.95; }
  .kernel.tier-small{ z-index:1; filter:blur(0.4px); opacity:0.8; }

  .kernel .petal{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 32% 26%, #FDFDFD 0%, #F4EFEA 55%, #C5BBB1 100%);
    box-shadow:
      inset -3px -3px 4px rgba(140,70,17,0.20),
      inset 2px 2px 3px rgba(255,255,255,0.65),
      0 1px 2px rgba(0,0,0,0.22);
  }
  .kernel .p1{ border-radius:58% 42% 63% 37% / 47% 58% 42% 53%; }
  .kernel .p2{ border-radius:40% 60% 45% 55% / 60% 40% 62% 38%; transform:rotate(35deg) scale(0.82); }
  .kernel .p3{ border-radius:65% 35% 40% 60% / 40% 55% 45% 60%; transform:rotate(-28deg) scale(0.7); }
  .kernel .core{
    position:absolute;
    width:38%; height:34%;
    left:30%; top:40%;
    border-radius:50% 50% 55% 45% / 55% 45% 55% 45%;
    background:radial-gradient(circle at 35% 28%, #F2AA4C 0%, #D9822B 55%, #8C4611 100%);
    box-shadow:0 0 4px rgba(242,170,76,0.55), inset -1px -1px 2px rgba(140,70,17,0.55);
  }

  @keyframes fallIn{
    0%{ transform:translateY(-46px) rotate(var(--rot,0deg)) scale(0.6); opacity:0; }
    62%{ transform:translateY(8px) rotate(var(--rot,0deg)) scale(1.06); opacity:1; }
    100%{ transform:translateY(0) rotate(var(--rot,0deg)) scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .kernel{animation:none;opacity:1;transform:translateY(0) rotate(var(--rot,0deg)) scale(1);}
  }

  #app{
    position:relative;
    z-index:1;
    max-width:var(--max);
    margin:0 auto;
    padding:20px 16px 48px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Marquee header ---------- */
  .marquee{
    text-align:center;
    padding:18px 10px 22px;
    position:relative;
  }
  .marquee-bulbs{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:10px;
  }
  .bulb{
    width:6px;height:6px;border-radius:50%;
    background:var(--marquee);
    box-shadow:0 0 6px 1px rgba(242,169,59,0.7);
    animation:flicker 2.6s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .bulb{animation:none;opacity:0.9;} }
  .bulb:nth-child(odd){animation-delay:0.4s;}
  .bulb:nth-child(3n){animation-delay:0.9s;}
  @keyframes flicker{
    0%,100%{opacity:1;}
    50%{opacity:0.35;}
  }
  .marquee h1{
    font-family:'Bebas Neue',cursive;
    font-size:44px;
    letter-spacing:3px;
    margin:0;
    color:var(--marquee);
    line-height:0.95;
    text-shadow:0 0 18px rgba(242,169,59,0.25);
  }
  .marquee p{
    margin:6px 0 0;
    font-size:12.5px;
    color:var(--cream-dim);
    letter-spacing:0.5px;
    font-family:'IBM Plex Mono',monospace;
  }

  .header-shield{
    position:relative;
    margin:-20px -16px 0;
    padding:20px 16px 4px;
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
    background:linear-gradient(180deg, rgba(15,18,24,0.62) 0%, rgba(15,18,24,0.30) 75%, rgba(15,18,24,0) 100%);
  }

  /* ---------- top nav ---------- */
  .topnav{
    display:flex;
    flex-wrap:wrap;
    row-gap:8px;
    justify-content:space-between;
    align-items:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--cream-dim);
  }
  .topnav button{
    background:none;border:1px solid rgba(239,230,216,0.18);
    color:var(--cream-dim);
    padding:6px 10px;
    border-radius:20px;
    font-family:inherit;
    font-size:11px;
    cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .topnav button:hover{border-color:var(--marquee);color:var(--marquee);}

  /* ---------- progress dots (film perforation) ---------- */
  .perf{
    display:flex;
    gap:6px;
    justify-content:center;
    margin:22px 0 26px;
  }
  .perf span{
    width:9px;height:9px;border-radius:2px;
    background:var(--bg-elev-2);
    border:1px solid rgba(239,230,216,0.15);
  }
  .perf span.done{background:var(--marquee);border-color:var(--marquee);}
  .perf span.now{background:var(--velvet);border-color:var(--velvet);}

  /* ---------- step card ---------- */
  .step-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--marquee);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .step-question{
    font-family:'Bebas Neue',cursive;
    font-size:30px;
    letter-spacing:0.5px;
    line-height:1.05;
    margin:0 0 18px;
    color:var(--cream);
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .opt{
    text-align:left;
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.10);
    color:var(--cream);
    padding:13px 16px;
    border-radius:var(--radius);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:500;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:hover{border-color:var(--marquee);background:var(--bg-elev-2);}
  .opt:active{transform:scale(0.99);}
  .opt.selected{
    border-color:var(--marquee);
    background:linear-gradient(90deg, rgba(242,169,59,0.14), rgba(242,169,59,0.04));
  }

  .back-link{
    margin-top:18px;
    background:none;border:none;
    color:var(--cream-dim);
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    cursor:pointer;
    padding:6px 0;
  }
  .back-link:hover{color:var(--marquee);}

  /* ---------- summary ---------- */
  .summary-list{
    display:flex;flex-wrap:wrap;gap:8px;
    margin:4px 0 22px;
  }
  .tag{
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.14);
    padding:7px 12px;
    border-radius:20px;
    font-size:12.5px;
    color:var(--cream-dim);
  }
  .tag b{color:var(--cream);font-weight:600;}

  .cta{
    width:100%;
    background:var(--marquee);
    color:var(--ink);
    border:none;
    padding:15px 18px;
    border-radius:var(--radius);
    font-family:'Bebas Neue',cursive;
    font-size:19px;
    letter-spacing:1px;
    cursor:pointer;
    transition:filter .15s, transform .1s;
  }
  .cta:hover{filter:brightness(1.08);}
  .cta:active{transform:scale(0.985);}
  .cta.secondary{
    background:none;
    border:1px solid rgba(239,230,216,0.25);
    color:var(--cream);
  }
  .cta.small{padding:11px 14px;font-size:15px;}

  /* ---------- loading ---------- */
  .loading{
    text-align:center;
    padding:60px 10px;
  }
  .reel{
    width:46px;height:46px;margin:0 auto 18px;
    border-radius:50%;
    border:3px solid rgba(242,169,59,0.2);
    border-top-color:var(--marquee);
    animation:spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .reel{animation:spin 2.4s linear infinite;} }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{
    font-family:'IBM Plex Mono',monospace;
    color:var(--cream-dim);
    font-size:13px;
  }

  /* ---------- error ---------- */
  .error-box{
    background:rgba(196,85,61,0.12);
    border:1px solid rgba(196,85,61,0.4);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    font-size:13.5px;
    color:var(--cream);
  }

  /* ---------- results ---------- */
  .results-header{
    font-family:'Bebas Neue',cursive;
    font-size:26px;
    letter-spacing:0.5px;
    margin:0 0 4px;
  }
  .results-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--cream-dim);
    margin:0 0 20px;
  }

  /* ---------- hero pick ---------- */
  .hero-pick{
    border:1px solid rgba(242,169,59,0.35);
    background:linear-gradient(135deg, rgba(242,169,59,0.10), rgba(138,42,76,0.08));
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:26px;
  }
  .hero-pick .hp-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--marquee);
    margin-bottom:6px;
  }
  .hero-pick .hp-title{
    font-family:'Bebas Neue',cursive;
    font-size:24px;
    letter-spacing:0.3px;
    margin:0 0 6px;
  }
  .hero-pick .hp-reason{
    font-size:13px;
    color:var(--cream-dim);
    line-height:1.5;
    margin:0;
  }

  /* ---------- horizontal ticket carousel ---------- */
  .scroll-hint{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    color:var(--cream-dim);
    text-align:center;
    margin:0 0 12px;
    opacity:0.75;
  }
  .tickets-scroll{
    display:flex;
    gap:16px;
    overflow-x:auto;
    overflow-y:visible;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    margin:0 -16px 8px;
    padding:4px 16px 20px;
    scrollbar-width:thin;
    scrollbar-color:var(--marquee-dim) transparent;
  }
  .tickets-scroll::-webkit-scrollbar{height:6px;}
  .tickets-scroll::-webkit-scrollbar-track{background:transparent;}
  .tickets-scroll::-webkit-scrollbar-thumb{background:var(--marquee-dim);border-radius:3px;}
  .tickets-scroll .ticket{
    flex:0 0 82vw;
    max-width:300px;
    scroll-snap-align:start;
    margin-bottom:0;
  }

  .ticket{
    position:relative;
    background:var(--cream);
    color:var(--ink);
    border-radius:var(--radius);
    overflow:visible;
  }

  /* poster / backdrop banner */
  .ticket-banner{
    position:relative;
    height:170px;
    border-radius:var(--radius) var(--radius) 0 0;
    overflow:hidden;
    background:linear-gradient(135deg,#2b2f3a,#11141b);
  }
  .ticket-banner img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .25s ease;
  }
  .ticket-banner img.loaded{opacity:1;}
  .ticket-banner .fallback{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    gap:6px;
    color:rgba(239,230,216,0.32);
    text-align:center;
    padding:10px;
  }
  .ticket-banner .fallback .ico{font-size:26px;}
  .ticket-banner .fallback .txt{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .ticket-banner .fallback .spin-mini{
    width:18px;height:18px;
    border-radius:50%;
    border:2px solid rgba(242,169,59,0.25);
    border-top-color:var(--marquee);
    animation:spin 0.9s linear infinite;
    margin-bottom:2px;
  }
  @media (prefers-reduced-motion: reduce){ .spin-mini{animation:spin 2.4s linear infinite;} }

  .ticket-head{
    padding:14px 18px 16px;
    position:relative;
  }
  .rank-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  .badges-left{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .rank-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    background:var(--velvet);
    color:var(--cream);
    padding:4px 9px;
    border-radius:3px;
  }
  .age-badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.5px;
    background:rgba(24,19,16,0.08);
    color:var(--ink);
    border:1px solid rgba(24,19,16,0.2);
    padding:4px 8px;
    border-radius:3px;
  }
  .match-stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    font-weight:600;
    color:var(--teal);
    border:1.5px solid var(--teal);
    padding:3px 8px;
    border-radius:3px;
    transform:rotate(-3deg);
    white-space:nowrap;
  }
  .ticket h3{
    font-family:'Bebas Neue',cursive;
    font-size:26px;
    letter-spacing:0.3px;
    margin:2px 0 0;
    line-height:1.05;
  }
  .ticket .orig-title{
    font-size:12px;
    font-style:italic;
    color:#5a5148;
    margin:2px 0 0;
  }
  .meta-row{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:#5a5148;
    margin-top:8px;
    display:flex;flex-wrap:wrap;gap:10px;
  }
  .vibe-row{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-top:10px;
  }
  .vibe-chip{
    font-size:10.5px;
    font-family:'IBM Plex Mono',monospace;
    color:var(--velvet);
    border:1px solid rgba(138,42,76,0.4);
    padding:3px 8px;
    border-radius:12px;
  }
  .tear-line{
    border-top:2px dashed rgba(24,19,16,0.22);
    margin:0 18px;
    position:relative;
  }
  .tear-line::before, .tear-line::after{
    content:"";
    position:absolute;
    top:-11px;
    width:22px;height:22px;
    background:var(--bg);
    border-radius:50%;
  }
  .tear-line::before{left:-29px;}
  .tear-line::after{right:-29px;}
  .ticket-body{
    padding:16px 18px 20px;
  }
  .ticket-body .label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--velvet);
    margin:0 0 4px;
  }
  .ticket-body p{
    margin:0 0 14px;
    font-size:13.5px;
    line-height:1.5;
  }

  .ratings-row{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-bottom:12px;
  }
  .rating-pill{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    font-weight:600;
    padding:5px 10px;
    border-radius:6px;
    background:rgba(24,19,16,0.06);
    border:1px solid rgba(24,19,16,0.12);
  }
  .awards-row{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;
    color:var(--gold);
    background:rgba(201,153,46,0.12);
    border:1px solid rgba(201,153,46,0.35);
    padding:7px 10px;
    border-radius:6px;
    margin-bottom:14px;
  }

  .watch-chips{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-bottom:16px;
  }
  .watch-chip{
    font-size:11.5px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    background:rgba(60,140,122,0.12);
    border:1px solid rgba(60,140,122,0.35);
    color:#1f4f44;
    padding:5px 10px;
    border-radius:14px;
    display:inline-flex;align-items:center;gap:5px;
  }

  .links-row{
    display:flex;gap:8px;flex-wrap:wrap;
    margin-top:2px;
  }
  .link-chip{
    font-size:11.5px;
    font-family:'IBM Plex Mono',monospace;
    text-decoration:none;
    color:var(--ink);
    background:rgba(24,19,16,0.06);
    border:1px solid rgba(24,19,16,0.15);
    padding:6px 10px;
    border-radius:16px;
  }
  .link-chip:hover{background:rgba(24,19,16,0.12);}

  .interp-box{
    font-size:13px;
    color:var(--cream-dim);
    background:var(--bg-elev);
    border-left:2px solid var(--marquee);
    padding:12px 14px;
    border-radius:6px;
    margin-bottom:22px;
    line-height:1.5;
  }

  .disclaimer{
    font-size:11px;
    color:var(--cream-dim);
    opacity:0.65;
    line-height:1.5;
    margin-top:4px;
    text-align:center;
  }

  /* ---------- history ---------- */
  .hist-item{
    background:var(--bg-elev);
    border:1px solid rgba(239,230,216,0.1);
    border-radius:var(--radius);
    padding:13px 15px;
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s;
  }
  .hist-item:hover{border-color:var(--marquee);}
  .hist-item .hd{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--cream-dim);
    margin-bottom:6px;
  }
  .hist-item .ht{
    font-size:13.5px;
    font-weight:600;
  }
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--cream-dim);
    font-size:13.5px;
  }

  /* ---------- reações (gostei / não gostei / já assisti) ---------- */
  .reaction-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .reaction-btn{
    font-family:'IBM Plex Mono',monospace;font-size:11px;
    background:rgba(24,19,16,0.06);border:1px solid rgba(24,19,16,0.18);
    color:var(--ink);padding:7px 11px;border-radius:16px;cursor:pointer;
  }
  .reaction-btn.active-like{background:var(--teal);border-color:var(--teal);color:var(--cream);}
  .reaction-btn.active-dislike{background:var(--danger);border-color:var(--danger);color:var(--cream);}
  .reaction-btn.active-watched{background:var(--marquee);border-color:var(--marquee);color:var(--ink);}

  /* ---------- minhas marcações ---------- */
  .mark-item{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:var(--bg-elev);border:1px solid rgba(239,230,216,0.1);
    border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;
  }
  .mark-info{flex:1;min-width:0;}
  .mark-item .cta{width:auto;flex:0 0 auto;}
  .mark-title{font-size:13.5px;font-weight:600;margin-bottom:6px;}
  .mark-badges{display:flex;flex-wrap:wrap;gap:6px;}

<body>
<div id="popcorn-bg"></div>
<div id="app"></div>

<script>
/* =========================================================
   PIPOCA & PLAY — motor de recomendação
   Preserva a lógica dos 7 filtros do MVP original.
   ========================================================= */

const PROMPT_VERSION = "v1.2";

// Rota do backend. A chave OpenAI fica exclusivamente no servidor.
const RECOMMENDATION_ENDPOINT = "/api/recommend";

const STEPS = [
  {
    key: "genre",
    eyebrow: "1 de 7",
    question: "O que você quer assistir?",
    options: ["Livre (Qualquer)","Ação","Comédia","Drama","Ficção Científica","Terror","Romance","Suspense / Thriller","Animação","Documentário","Aventura","Fantasia"]
  },
  {
    key: "mood",
    eyebrow: "2 de 7",
    question: "Como você quer se sentir?",
    options: ["Livre (Qualquer)","Quer dar risada / Divertido","Para chorar / Emocionante","Tensão / Adrenalina","Para pensar / Cabeça","Leve / Relaxante para descansar","Inspirador / Motivacional","Sombrio / Assustador"]
  },
  {
    key: "duration",
    eyebrow: "3 de 7",
    question: "Quanto tempo você tem?",
    options: ["Livre (Qualquer)","Curto (Até 90 min)","Padrão (90 a 120 min)","Longo (Mais de 120 min)"]
  },
  {
    key: "era",
    eyebrow: "4 de 7",
    question: "Você prefere alguma época?",
    options: ["Livre (Qualquer)","Lançamentos Recentes (2023-2026)","Anos 2010s","Anos 2000s","Anos 90s","Clássicos (Antes de 1990)"]
  },
  {
    key: "platform",
    eyebrow: "5 de 7",
    question: "Onde pretende assistir?",
    options: ["Livre (Qualquer)","Netflix","Amazon Prime Video","Max (HBO)","Disney+","Apple TV+","Paramount+","Cinema / Aluguel"]
  },
  {
    key: "companionship",
    eyebrow: "6 de 7",
    question: "Vai assistir com quem?",
    options: ["Sozinho(a)","Em Casal","Com Amigos","Em Família (com crianças)"]
  },
  {
    key: "popularity",
    eyebrow: "7 de 7",
    question: "Que tipo de filme você prefere?",
    options: ["Indiferente","Grandes Sucessos / Blockbusters","Filmes Cult / Menos Conhecidos","Aclamados pela Crítica / Premiações (Oscar, Cannes)"]
  }
];

const LOADING_MESSAGES = [
  "Consultando o roteirista de plantão…",
  "Comparando clima, tempo e companhia…",
  "Selecionando os 3 melhores candidatos…",
  "Buscando os pôsteres certinhos…"
];

let sessionUser = null;
let authError = "";
let adminStatus = null;
const ADMIN_PANEL_URL = "/admin";
let authMode = "login";
let accessStatus = null;
let pendingStatusTimer = null;
let pendingAccess = null;
try{
  pendingAccess = JSON.parse(window.localStorage.getItem("pipoca_pending_access") || "null");
}catch(e){
  pendingAccess = null;
}

let state = {
  screen: "landing", // landing | login | wizard | summary | loading | results | history | marks | billing | admin | error
  stepIndex: 0,
  filters: {},
  interpretation: "",
  bestChoice: null,
  recommendations: [],
  errorMsg: "",
  historyList: null,
  viewingHistoryItem: null,
  billing: null,
  reactionsByKey: {},
  marksList: null
};

/* =========================================================
   NAVEGAÇÃO — pushState/popstate para o botão voltar nativo
   ========================================================= */
function navSnapshot(){
  return {
    screen: state.screen,
    stepIndex: state.stepIndex,
    authMode: authMode,
    viewingHistoryItem: state.viewingHistoryItem || null
  };
}

function pushNav(patch){
  const { authMode: newAuthMode, ...rest } = patch;
  if(newAuthMode !== undefined) authMode = newAuthMode;
  Object.assign(state, rest);
  authError = "";
  try{ history.pushState(navSnapshot(), "", location.pathname); }catch(e){}
  render();
}

function replaceNav(patch){
  const { authMode: newAuthMode, ...rest } = patch;
  if(newAuthMode !== undefined) authMode = newAuthMode;
  Object.assign(state, rest);
  try{ history.replaceState(navSnapshot(), "", location.pathname); }catch(e){}
  render();
}

window.addEventListener("popstate", (event) => {
  const snap = event.state;
  if(!snap) return;
  state.screen = snap.screen || "landing";
  state.stepIndex = snap.stepIndex || 0;
  state.viewingHistoryItem = snap.viewingHistoryItem || null;
  authMode = snap.authMode || "login";
  authError = "";
  render();
});

async function bootstrapAuth(){
  let initialScreen = "landing";
  try{
    const response = await fetch("/api/auth/me", { credentials: "same-origin" });
    const data = await response.json();
    if(data.authenticated){
      sessionUser = data.user;
      initialScreen = sessionUser.role === "admin" ? "admin" : "wizard";
      if(sessionUser.role !== "admin") loadBillingStatus();
    }else if(pendingAccess && pendingAccess.email && pendingAccess.token){
      initialScreen = "access-status";
      checkPendingAccess(true);
    }
  }catch(e){
    // A landing page continua disponível mesmo quando a API está temporariamente fora.
  }
  replaceNav({ screen: initialScreen });
  if(sessionUser && sessionUser.role === "admin") await openAdmin();
}

function setPendingAccess(data){
  pendingAccess = { email: data.email, token: data.token };
  accessStatus = data.status || "pending";
  try{ window.localStorage.setItem("pipoca_pending_access", JSON.stringify(pendingAccess)); }catch(e){}
}

function clearPendingAccess(){
  pendingAccess = null;
  accessStatus = null;
  try{ window.localStorage.removeItem("pipoca_pending_access"); }catch(e){}
  if(pendingStatusTimer){ clearTimeout(pendingStatusTimer); pendingStatusTimer = null; }
}

async function checkPendingAccess(shouldRender = true){
  if(!pendingAccess || !pendingAccess.email || !pendingAccess.token) return;
  try{
    const query = "?email=" + encodeURIComponent(pendingAccess.email) + "&token=" + encodeURIComponent(pendingAccess.token);
    const response = await fetch("/api/auth/status" + query, { credentials: "same-origin", cache: "no-store" });
    const data = await response.json().catch(() => ({}));
    if(response.ok && data.status){
      accessStatus = data.status;
      if(accessStatus !== "pending") pendingStatusTimer = null;
      if(shouldRender && state.screen === "access-status") render();
      if(accessStatus === "pending" && state.screen === "access-status") pendingStatusTimer = setTimeout(() => checkPendingAccess(true), 15000);
      return;
    }
  }catch(e){}
  if(accessStatus === "pending" && state.screen === "access-status") pendingStatusTimer = setTimeout(() => checkPendingAccess(true), 15000);
}

async function login(email, password){
  authError = "";
  try{
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ email, password })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "Não foi possível entrar agora.");
    clearPendingAccess();
    sessionUser = data.user;
    if(sessionUser.role === "admin"){
      window.location.href = ADMIN_PANEL_URL;
      return;
    }
    replaceNav({ screen: "wizard", stepIndex: 0 });
    loadBillingStatus();
  }catch(e){
    authError = e.message || "Não foi possível entrar agora.";
    render();
  }
}

async function register(email, password, confirmation){
  authError = "";
  try{
    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password, confirmation })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "Não foi possível enviar o cadastro agora.");
    setPendingAccess(data);
    replaceNav({ screen: "access-status", authMode: "login" });
    checkPendingAccess(false);
  }catch(e){
    authError = e.message || "Não foi possível enviar o cadastro agora.";
    render();
  }
}

async function logout(){
  try{ await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); }catch(e){}
  sessionUser = null;
  adminStatus = null;
  clearPendingAccess();
  state.billing = null;
  state.reactionsByKey = {};
  state.marksList = null;
  replaceNav({ screen: "landing", stepIndex: 0, filters: {}, viewingHistoryItem: null });
}

async function openAdmin(){
  if(!sessionUser || sessionUser.role !== "admin") return;
  try{
    const response = await fetch("/api/admin/status", { credentials: "same-origin", cache: "no-store" });
    const data = await response.json();
    if(!response.ok) throw new Error(data.error || "Acesso negado.");
    adminStatus = data;
    replaceNav({ screen: "admin" });
  }catch(e){
    authError = e.message || "Não foi possível abrir o painel.";
    replaceNav({ screen: "wizard" });
  }
}

/* =========================================================
   ASSINATURA E CRÉDITOS (ASAAS)
   ========================================================= */
async function loadBillingStatus(){
  if(!sessionUser || sessionUser.role === "admin") return;
  try{
    const response = await fetch("/api/billing/status", { credentials: "same-origin", cache: "no-store" });
    const data = await response.json();
    if(response.ok){
      state.billing = data;
      render();
    }
  }catch(e){}
}

async function startCheckout(plan, name, cpfCnpj){
  authError = "";
  try{
    const response = await fetch("/api/billing/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ plan, name, cpf_cnpj: cpfCnpj })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "Não foi possível iniciar o pagamento agora.");
    if(data.checkout_url){
      window.location.href = data.checkout_url;
    }
  }catch(e){
    authError = e.message || "Não foi possível iniciar o pagamento agora.";
    render();
  }
}

/* =========================================================
   MARCAÇÕES (gostei / não gostei / já assisti)
   ========================================================= */
function reactionKey(rec){
  const title = (rec.title_original || rec.title_pt || "").trim().toLowerCase().replace(/\s+/g, " ");
  return title + "|" + (rec.year || 0);
}

async function loadReactionsForResults(){
  if(!sessionUser || sessionUser.role === "admin") return;
  try{
    const response = await fetch("/api/preferences", { credentials: "same-origin", cache: "no-store" });
    const data = await response.json();
    if(response.ok){
      const map = {};
      (data.reactions || []).forEach(r => { map[r.key] = r; });
      state.reactionsByKey = map;
      render();
    }
  }catch(e){}
}

async function saveReaction(rec, liked, watched){
  try{
    const response = await fetch("/api/preferences", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        title_original: rec.title_original || rec.title_pt,
        title_pt: rec.title_pt || rec.title_original,
        year: rec.year || 0,
        liked, watched
      })
    });
    const data = await response.json().catch(() => ({}));
    if(response.ok && data.reaction){
      state.reactionsByKey = { ...state.reactionsByKey, [data.reaction.key]: data.reaction };
      render();
    }
  }catch(e){}
}

async function loadMarks(){
  try{
    const response = await fetch("/api/preferences", { credentials: "same-origin", cache: "no-store" });
    const data = await response.json();
    return response.ok ? (data.reactions || []) : [];
  }catch(e){
    return [];
  }
}

async function removeMark(key){
  try{
    await fetch("/api/preferences", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ action: "delete", key })
    });
  }catch(e){}
  state.marksList = await loadMarks();
  const { [key]: removed, ...rest } = state.reactionsByKey;
  state.reactionsByKey = rest;
  render();
}

async function adminAction(userId, action){
  if(action === "delete" && !window.confirm("Excluir este usuário definitivamente?")) return;
  authError = "";
  try{
    const response = await fetch("/api/admin/users", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ user_id: userId, action })
    });
    const data = await response.json().catch(() => ({}));
    if(!response.ok) throw new Error(data.error || "Não foi possível atualizar o cadastro.");
    adminStatus = { ...adminStatus, summary: data.summary, users: data.users };
    render();
  }catch(e){
    authError = e.message || "Não foi possível atualizar o cadastro.";
    render();
  }
}

/* =========================================================
   PIPOCA DE FUNDO — enche a tela conforme o progresso
   ========================================================= */
function seededRandom(seed){
  let s = seed;
  return function(){
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

const rng = seededRandom(1337);
const POPCORN_COUNT = 170;
const POPCORN_KERNELS = [];
for(let i = 0; i < POPCORN_COUNT; i++){
  const r1 = rng(), r2 = rng(), r3 = rng(), r4 = rng(), r5 = rng();
  // tiers: pequenas ao fundo (mais comuns), médias flutuando, grandes em foco (mais raras)
  let tier, size;
  if(r5 < 0.40){ tier = "small";  size = 9 + r3 * 6;  }
  else if(r5 < 0.85){ tier = "medium"; size = 17 + r3 * 9; }
  else { tier = "large"; size = 27 + r3 * 9; }

  POPCORN_KERNELS.push({
    x: r1 * 100,
    y: Math.pow(r2, 1.35) * 100, // mais denso perto do topo, rareando conforme desce
    size: size,
    rot: r4 * 360,
    tier: tier
  });
}

const kernelEls = new Map(); // idx -> elemento no DOM

function popcornLevel(){
  // fração de 0 a 1 de quanto a tela deve estar "cheia" de pipoca, de cima para baixo
  if(state.screen === "wizard"){
    return state.stepIndex / STEPS.length;
  }
  // summary, loading, results, history, error: já respondeu tudo
  return 1;
}

function buildKernelEl(k){
  const el = document.createElement("div");
  el.className = "kernel tier-" + k.tier;
  el.style.left = k.x.toFixed(2) + "%";
  el.style.top = k.y.toFixed(2) + "%";
  el.style.width = k.size.toFixed(1) + "px";
  el.style.height = (k.size * 0.86).toFixed(1) + "px";
  el.style.setProperty("--rot", k.rot.toFixed(1) + "deg");

  const p1 = document.createElement("span");
  p1.className = "petal p1";
  const p2 = document.createElement("span");
  p2.className = "petal p2";
  const p3 = document.createElement("span");
  p3.className = "petal p3";
  const core = document.createElement("span");
  core.className = "core";

  el.appendChild(p1);
  el.appendChild(p2);
  el.appendChild(p3);
  el.appendChild(core);
  return el;
}

function syncPopcorn(){
  const container = document.getElementById("popcorn-bg");
  if(!container) return;
  const thresholdY = popcornLevel() * 100;

  POPCORN_KERNELS.forEach((k, idx) => {
    const shouldShow = k.y <= thresholdY;
    const exists = kernelEls.has(idx);

    if(shouldShow && !exists){
      const el = buildKernelEl(k);
      container.appendChild(el);
      kernelEls.set(idx, el);
    } else if(!shouldShow && exists){
      kernelEls.get(idx).remove();
      kernelEls.delete(idx);
    }
  });
}

async function getRecommendations(filters){
  const response = await fetch(RECOMMENDATION_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filters })
  });
  if(!response.ok){
    const error = await response.json().catch(() => ({}));
    const err = new Error(error.error || "Falha ao consultar o motor de recomendação (HTTP " + response.status + ").");
    err.status = response.status;
    throw err;
  }
  const data = await response.json();
  const text = data.text || "";
  const clean = text.replace(/```json/gi,"").replace(/```/g,"").trim();
  let parsed;
  try{
    parsed = JSON.parse(clean);
  }catch(e){
    throw new Error("Não consegui interpretar a resposta do motor de recomendação. Tente novamente.");
  }
  if(!parsed.recommendations || !Array.isArray(parsed.recommendations) || parsed.recommendations.length === 0){
    throw new Error("O motor de recomendação não retornou resultados válidos.");
  }
  return parsed;
}

/* =========================================================
   PÔSTERES REAIS — via Wikipedia REST API (sem chave)
   O modelo não consegue prever URLs de imagem válidas,
   então buscamos a imagem real do filme depois de ter o título.
   ========================================================= */
function upscaleWikiThumb(src){
  // ".../thumb/x/xx/Nome.jpg/220px-Nome.jpg" -> pede uma versão maior
  return src.replace(/\/\d+px-/, "/500px-");
}

async function wikiSummaryThumb(title, lang){
  try{
    const endpoint = "https://" + lang + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title);
    const res = await fetch(endpoint, { headers: { "accept": "application/json" } });
    if(!res.ok) return null;
    const data = await res.json();
    if(data.type === "disambiguation") return null;
    if(data.thumbnail && data.thumbnail.source){
      return upscaleWikiThumb(data.thumbnail.source);
    }
    return null;
  }catch(e){
    return null;
  }
}

async function fetchPosterUrl(rec){
  const original = (rec.title_original || rec.title_pt || "").trim();
  const pt = (rec.title_pt || rec.title_original || "").trim();
  const year = rec.year;
  if(!original && !pt) return "";

  const candidates = [];
  if(original){
    if(year) candidates.push(original + " (" + year + " film)");
    candidates.push(original + " (film)");
    candidates.push(original);
  }
  if(pt && pt !== original){
    candidates.push(pt);
  }

  for(const lang of ["en","pt"]){
    for(const c of candidates){
      const url = await wikiSummaryThumb(c, lang);
      if(url) return url;
    }
  }
  return "";
}

/* ---------- storage helpers ---------- */
function browserStorage(){
  if(window.storage && typeof window.storage.set === "function" && typeof window.storage.list === "function"){
    return {
      async set(key, value){ await window.storage.set(key, value, false); },
      async list(prefix){ return await window.storage.list(prefix, false); },
      async get(key){ return await window.storage.get(key, false); }
    };
  }
  return {
    async set(key, value){ window.localStorage.setItem(key, value); },
    async list(prefix){ return { keys: Object.keys(window.localStorage).filter(key => key.startsWith(prefix)) }; },
    async get(key){ return { value: window.localStorage.getItem(key) }; }
  };
}

async function saveToHistory(record){
  try{
    const key = "search:" + record.created_at;
    await browserStorage().set(key, JSON.stringify(record));
  }catch(e){ /* best-effort, non-blocking */ }
}

async function loadHistory(){
  try{
    const storage = browserStorage();
    const listing = await storage.list("search:");
    const keys = (listing && listing.keys) ? listing.keys.slice().sort().reverse() : [];
    const items = [];
    for(const k of keys){
      try{
        const r = await storage.get(k);
        if(r && r.value) items.push(JSON.parse(r.value));
      }catch(e){}
    }
    return items;
  }catch(e){
    return [];
  }
}

async function runSearch(){
  state.screen = "loading";
  render();
  try{
    const result = await getRecommendations(state.filters);

    // busca os pôsteres reais antes de mostrar os cards
    await Promise.all(result.recommendations.map(async rec => {
      if(rec.poster_url) return;
      try{
        const poster = await fetchPosterUrl(rec);
        rec.poster_url = poster || "";
      }catch(e){
        rec.poster_url = "";
      }
    }));

    pushNav({
      interpretation: result.interpretation || "",
      bestChoice: result.best_choice || null,
      recommendations: result.recommendations,
      screen: "results"
    });
    loadReactionsForResults();
    loadBillingStatus();

    const record = {
      filters: { ...state.filters },
      interpretation: state.interpretation,
      bestChoice: state.bestChoice,
      recommendations: state.recommendations,
      prompt_version: PROMPT_VERSION,
      created_at: new Date().toISOString()
    };
    saveToHistory(record);
  }catch(e){
    if(e.status === 402){
      authError = e.message || "Assine um plano para continuar.";
      await loadBillingStatus();
      pushNav({ screen: "billing" });
      return;
    }
    state.errorMsg = e.message || "Não consegui buscar recomendações agora.";
    state.screen = "error";
    render();
  }
}

function renderTicket(rec){
  const t = document.createElement("div");
  t.className = "ticket";

  /* --- banner / poster --- */
  const banner = document.createElement("div");
  banner.className = "ticket-banner";
  const fallback = document.createElement("div");
  fallback.className = "fallback";
  fallback.innerHTML = '<span class="ico">🎞️</span><span class="txt">pôster não disponível</span>';
  banner.appendChild(fallback);

  if(rec.backdrop_url || rec.poster_url){
    const img = document.createElement("img");
    img.src = rec.backdrop_url || rec.poster_url;
    img.alt = rec.title_pt || rec.title_original || "pôster do filme";
    img.loading = "lazy";
    img.onload = () => {
      img.classList.add("loaded");
      fallback.style.display = "none";
    };
    img.onerror = () => { img.remove(); };
    banner.appendChild(img);
  }

  const head = document.createElement("div");
  head.className = "ticket-head";

  const rankRow = document.createElement("div");
  rankRow.className = "rank-row";

  const badgesLeft = document.createElement("div");
  badgesLeft.className = "badges-left";
  const badge = document.createElement("span");
  badge.className = "rank-badge";
  badge.textContent = "ESCOLHA #" + rec.rank;
  badgesLeft.appendChild(badge);
  if(rec.age_rating_br){
    const age = document.createElement("span");
    age.className = "age-badge";
    age.textContent = rec.age_rating_br + " anos";
    badgesLeft.appendChild(age);
  }

  const stamp = document.createElement("span");
  stamp.className = "match-stamp";
  stamp.textContent = (rec.match_score || "—") + "% MATCH";

  rankRow.appendChild(badgesLeft);
  rankRow.appendChild(stamp);

  const h3 = document.createElement("h3");
  h3.textContent = rec.title_pt || rec.title_original;

  head.appendChild(rankRow);
  head.appendChild(h3);

  if(rec.title_pt && rec.title_original && rec.title_pt !== rec.title_original){
    const orig = document.createElement("div");
    orig.className = "orig-title";
    orig.textContent = "Título original: " + rec.title_original;
    head.appendChild(orig);
  }

  const meta = document.createElement("div");
  meta.className = "meta-row";
  const parts = [];
  if(rec.year) parts.push(String(rec.year));
  if(rec.runtime_minutes) parts.push(rec.runtime_minutes + " min");
  if(rec.genres && rec.genres.length) parts.push(rec.genres.join(" · "));
  parts.forEach(p => {
    const span = document.createElement("span");
    span.textContent = p;
    meta.appendChild(span);
  });
  head.appendChild(meta);

  if(rec.vibe_tags && rec.vibe_tags.length){
    const vibeRow = document.createElement("div");
    vibeRow.className = "vibe-row";
    rec.vibe_tags.forEach(v => {
      const chip = document.createElement("span");
      chip.className = "vibe-chip";
      chip.textContent = v;
      vibeRow.appendChild(chip);
    });
    head.appendChild(vibeRow);
  }

  const tear = document.createElement("div");
  tear.className = "tear-line";

  const body = document.createElement("div");
  body.className = "ticket-body";

  const l1 = document.createElement("div");
  l1.className = "label";
  l1.textContent = "SINOPSE";
  const p1 = document.createElement("p");
  p1.textContent = rec.synopsis || "";

  const l2 = document.createElement("div");
  l2.className = "label";
  l2.textContent = "POR QUE COMBINA";
  const p2 = document.createElement("p");
  p2.textContent = rec.why_it_matches || "";

  body.appendChild(l1);
  body.appendChild(p1);
  body.appendChild(l2);
  body.appendChild(p2);

  /* ratings */
  if(rec.ratings && (rec.ratings.imdb || rec.ratings.rotten_tomatoes_critics)){
    const ratingsRow = document.createElement("div");
    ratingsRow.className = "ratings-row";
    if(rec.ratings.imdb){
      const pill = document.createElement("span");
      pill.className = "rating-pill";
      pill.textContent = "IMDb " + rec.ratings.imdb;
      ratingsRow.appendChild(pill);
    }
    if(rec.ratings.rotten_tomatoes_critics){
      const pill = document.createElement("span");
      pill.className = "rating-pill";
      pill.textContent = "🍅 " + rec.ratings.rotten_tomatoes_critics + "%";
      ratingsRow.appendChild(pill);
    }
    body.appendChild(ratingsRow);
  }

  /* awards */
  if(rec.awards && (rec.awards.oscars_won || rec.awards.highlight)){
    const awardsRow = document.createElement("div");
    awardsRow.className = "awards-row";
    let txt = "🏆 ";
    if(rec.awards.oscars_won) txt += rec.awards.oscars_won + "x Oscar";
    if(rec.awards.highlight) txt += (rec.awards.oscars_won ? " · " : "") + rec.awards.highlight;
    awardsRow.textContent = txt;
    body.appendChild(awardsRow);
  }

  /* where to watch */
      if(rec.where_to_watch && rec.where_to_watch.length){

    const wl = document.createElement("div");
    wl.className = "label";
    wl.textContent = "ONDE ASSISTIR";
    body.appendChild(wl);
    const chips = document.createElement("div");
    chips.className = "watch-chips";
    rec.where_to_watch.slice(0,4).forEach(w => {
      if(!w.platform) return;
      const chip = document.createElement("span");
      chip.className = "watch-chip";
      const icon = WATCH_TYPE_ICON[w.type] || "🎬";
      const label = WATCH_TYPE_LABEL[w.type] || "";
      chip.textContent = icon + " " + w.platform + (label ? " · " + label : "");
      chips.appendChild(chip);
    });
    body.appendChild(chips);
  }else{
    const unavailable = document.createElement("p");
    unavailable.className = "disclaimer";
    unavailable.style.textAlign = "left";
    unavailable.textContent = rec.availability_note || "Disponibilidade não confirmada no momento.";
    body.appendChild(unavailable);
  }

  /* verification links */
  const linksLabel = document.createElement("div");
  linksLabel.className = "label";
  linksLabel.textContent = "CONFERIR NA FONTE";
  body.appendChild(linksLabel);

  const links = document.createElement("div");
  links.className = "links-row";
  const titleForLinks = rec.title_original || rec.title_pt;
  [
    ["JustWatch", justWatchUrl(titleForLinks)],
    ["IMDb", imdbUrl(titleForLinks)],
    ["Letterboxd", letterboxdUrl(titleForLinks)]
  ].forEach(([label, url]) => {
    const a = document.createElement("a");
    a.className = "link-chip";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = label + " ↗";
    links.appendChild(a);
  });
  body.appendChild(links);

  if(sessionUser && sessionUser.role !== "admin"){
    const key = reactionKey(rec);
    const current = state.reactionsByKey[key] || { liked: null, watched: false };
    const reactionRow = document.createElement("div");
    reactionRow.className = "reaction-row";

    const likeBtn = document.createElement("button");
    likeBtn.type = "button";
    likeBtn.className = "reaction-btn" + (current.liked === true ? " active-like" : "");
    likeBtn.textContent = "👍 Gostei";

    const dislikeBtn = document.createElement("button");
    dislikeBtn.type = "button";
    dislikeBtn.className = "reaction-btn" + (current.liked === false ? " active-dislike" : "");
    dislikeBtn.textContent = "👎 Não gostei";
    dislikeBtn.onclick = () => saveReaction(rec, current.liked === false ? null : false, current.watched);

    const watchedBtn = document.createElement("button");
    watchedBtn.type = "button";
    watchedBtn.className = "reaction-btn" + (current.watched ? " active-watched" : "");
    watchedBtn.textContent = "✔️ Já assisti";
    watchedBtn.onclick = () => saveReaction(rec, current.liked, !current.watched);

    reactionRow.appendChild(likeBtn);
    reactionRow.appendChild(dislikeBtn);
    reactionRow.appendChild(watchedBtn);
    body.appendChild(reactionRow);
  }

  t.appendChild(banner);
  t.appendChild(head);
  t.appendChild(tear);
  t.appendChild(body);
  return t;
}

    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = "Você ainda não marcou nenhum título.";
    wrap.appendChild(empty);
    return wrap;
  }

  list.forEach(item => {
    const row = document.createElement("div");
    row.className = "mark-item";

    const info = document.createElement("div");
    info.className = "mark-info";
    const title = document.createElement("div");
    title.className = "mark-title";
    title.textContent = (item.title_pt || item.title_original) + (item.year ? " (" + item.year + ")" : "");
    const badges = document.createElement("div");
    badges.className = "mark-badges";
    if(item.liked === true){ const b = document.createElement("span"); b.className = "mark-badge like"; b.textContent = "👍 Gostei"; badges.appendChild(b); }
    if(item.liked === false){ const b = document.createElement("span"); b.className = "mark-badge dislike"; b.textContent = "👎 Não gostei"; badges.appendChild(b); }
    if(item.watched){ const b = document.createElement("span"); b.className = "mark-badge watched"; b.textContent = "✔️ Já assisti"; badges.appendChild(b); }
    info.appendChild(title);
    info.appendChild(badges);

    const remove = document.createElement("button");
    remove.className = "cta small secondary";
    remove.textContent = "Remover";
    remove.onclick = () => removeMark(item.key);

    row.appendChild(info);
    row.appendChild(remove);
    wrap.appendChild(row);
  });

  return wrap;
}

function renderBilling(){
  const wrap = document.createElement("div");
  const h = document.createElement("div");
  h.className = "results-header";
  h.textContent = "Assinatura e créditos";
  wrap.appendChild(h);

  if(authError){
    const error = document.createElement("div");
    error.className = "auth-error";
    error.textContent = authError;
    wrap.appendChild(error);
  }

  const account = state.billing && state.billing.account;
  const status = document.createElement("div");
  status.className = "interp-box";
  if(!account || account.plan === "none"){
    status.textContent = "Você ainda não tem um plano ativo. Escolha um plano abaixo para começar a receber recomendações.";
  }else if(account.plan_status === "pending"){
    status.textContent = "Pagamento do plano " + account.plan_label + " ainda não confirmado. Assim que o ASAAS confirmar, seus créditos são liberados automaticamente.";
  }else if(account.plan_status === "past_due"){
    status.textContent = "A cobrança do plano " + account.plan_label + " está em atraso. Regularize o pagamento para voltar a receber recomendações.";
  }else if(account.plan_status === "canceled"){
    status.textContent = "Sua assinatura do plano " + account.plan_label + " foi cancelada. Assine novamente para continuar.";
  }else{
    status.textContent = "Plano " + account.plan_label + " ativo — " +
      (account.unlimited ? "créditos ilimitados." : (account.remaining_today ?? 0) + " de " + account.daily_limit + " créditos disponíveis hoje.");
  }
  wrap.appendChild(status);

  if(account && account.plan_status === "pending"){
    const refresh = document.createElement("button");
    refresh.className = "cta small";
    refresh.textContent = "Já paguei, verificar agora";
    refresh.onclick = () => loadBillingStatus();
    wrap.appendChild(refresh);
  }

  const plans = (state.billing && state.billing.plans) || [];
  const plansRow = document.createElement("div");
  plansRow.className = "plans-row";

  plans.forEach(plan => {
    const card = document.createElement("div");
    card.className = "plan-card" + (account && account.plan === plan.id && account.plan_status === "active" ? " current" : "");

    const name = document.createElement("div");
    name.className = "plan-name";
    name.textContent = plan.label;

    const price = document.createElement("div");
    price.className = "plan-price";
    price.textContent = "R$ " + plan.price.toFixed(2).replace(".", ",") + "/mês";

    const credits = document.createElement("div");
    credits.className = "plan-credits";
    credits.textContent = plan.daily_credits ? plan.daily_credits + " créditos por dia" : "Créditos ilimitados";

    const nameField = document.createElement("input");
    nameField.type = "text";
    nameField.placeholder = "Nome completo";
    nameField.className = "plan-input";

    const docField = document.createElement("input");
    docField.type = "text";
    docField.placeholder = "CPF ou CNPJ";
    docField.className = "plan-input";

    const subscribe = document.createElement("button");
    subscribe.className = "cta small";
    subscribe.textContent = "Assinar " + plan.label;
    subscribe.onclick = () => startCheckout(plan.id, nameField.value, docField.value);

    card.appendChild(name);
    card.appendChild(price);
    card.appendChild(credits);
    card.appendChild(nameField);
    card.appendChild(docField);
    card.appendChild(subscribe);
    plansRow.appendChild(card);
  });

  wrap.appendChild(plansRow);

  const note = document.createElement("p");
  note.className = "auth-footnote";
  note.textContent = "1 crédito = 1 consulta de filme, série ou novela. O pagamento é processado pelo ASAAS; os resultados só são liberados após a confirmação do pagamento.";
  wrap.appendChild(note);

  return wrap;
}

function escapeHtml(str){
  if(str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

render();
bootstrapAuth();
</script>
